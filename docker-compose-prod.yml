services:
  frontend:
    image: ${LANVERSE_FRONTEND_IMAGE:?LANVERSE_FRONTEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    image: ${LANVERSE_BACKEND_IMAGE:?LANVERSE_BACKEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8686
      CORS_ORIGINS: ${LANVERSE_CORS_ORIGINS:?LANVERSE_CORS_ORIGINS is required}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-lanverse}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-lanverse-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lanverse-web}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      REGISTRATION_VERIFICATION_CODE: ""
      AGENT_URL: ${AGENT_URL:?AGENT_URL is required}
      AGENT_EXECUTION_SECRET: ${AGENT_EXECUTION_SECRET:?AGENT_EXECUTION_SECRET is required}
      AGENT_RUNTIME_IMAGE_DIGEST: ${AGENT_RUNTIME_IMAGE_DIGEST:?AGENT_RUNTIME_IMAGE_DIGEST is required}
      AGENT_RUNTIME_ADDITIONAL_REVISIONS: ${AGENT_RUNTIME_ADDITIONAL_REVISIONS:-[]}
      AGENT_POLL_INTERVAL_MS: ${AGENT_POLL_INTERVAL_MS:-500}
      REVIEW_CLAIM_LEASE_SECONDS: ${REVIEW_CLAIM_LEASE_SECONDS:-300}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-lanverse-production-v1}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-true}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_SCRIPT_ALIAS: lanverse-script-search-v1
      ELASTICSEARCH_STORYGRAPH_ALIAS: lanverse-storygraph-search-v1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  workflow-worker:
    image: ${LANVERSE_BACKEND_IMAGE:?LANVERSE_BACKEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-lanverse}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-lanverse-production-v1}
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  event-worker:
    image: ${LANVERSE_BACKEND_IMAGE:?LANVERSE_BACKEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-lanverse}
      EVENT_WORKER_HOST: 0.0.0.0
      EVENT_WORKER_PORT: 8687
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: lanverse-event-worker
      KAFKA_CONSUMER_GROUP: lanverse.search-projector.v1
      KAFKA_USERNAME: event_worker
      KAFKA_PASSWORD: ${KAFKA_EVENT_WORKER_PASSWORD:?KAFKA_EVENT_WORKER_PASSWORD is required}
      KAFKA_SCRIPT_TOPIC: lanverse.business.script-version.v1
      KAFKA_SCRIPT_DLQ_TOPIC: lanverse.business.script-version.dlq.v1
      KAFKA_STORYGRAPH_TOPIC: lanverse.business.storygraph-version.v1
      KAFKA_STORYGRAPH_DLQ_TOPIC: lanverse.business.storygraph-version.dlq.v1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_SCRIPT_ALIAS: lanverse-script-search-v1
      ELASTICSEARCH_STORYGRAPH_ALIAS: lanverse-storygraph-search-v1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  postgres:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  minio:
    restart: unless-stopped
    ports: !reset []
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:?MINIO_CORS_ORIGINS is required}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  minio-init:
    restart: "no"

  kafka:
    restart: unless-stopped
    ports: !reset []
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}"
        user_admin="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}";
      KAFKA_LISTENER_NAME_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}"
        user_admin="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}"
        user_event_worker="${KAFKA_EVENT_WORKER_PASSWORD:?KAFKA_EVENT_WORKER_PASSWORD is required}"
        user_filebeat="${KAFKA_FILEBEAT_PASSWORD:?KAFKA_FILEBEAT_PASSWORD is required}"
        user_logstash="${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD is required}";
      KAFKA_LISTENER_NAME_PLAINTEXT__HOST_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}"
        user_admin="${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}"
        user_event_worker="${KAFKA_EVENT_WORKER_PASSWORD:?KAFKA_EVENT_WORKER_PASSWORD is required}"
        user_filebeat="${KAFKA_FILEBEAT_PASSWORD:?KAFKA_FILEBEAT_PASSWORD is required}"
        user_logstash="${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD is required}";
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  kafka-init:
    restart: "no"
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}

  elasticsearch:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  elasticsearch-init:
    restart: "no"

  filebeat:
    restart: unless-stopped
    environment:
      KAFKA_FILEBEAT_PASSWORD: ${KAFKA_FILEBEAT_PASSWORD:?KAFKA_FILEBEAT_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  logstash:
    restart: unless-stopped
    environment:
      KAFKA_LOGSTASH_PASSWORD: ${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  kibana:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M

  kibana-init:
    restart: "no"
