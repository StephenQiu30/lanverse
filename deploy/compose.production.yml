name: lanverse

services:
  frontend:
    image: ${LANVERSE_FRONTEND_IMAGE:?LANVERSE_FRONTEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    image: ${LANVERSE_BACKEND_IMAGE:?LANVERSE_BACKEND_IMAGE is required}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      AGENT_EXECUTION_SECRET: ${AGENT_EXECUTION_SECRET:?AGENT_EXECUTION_SECRET is required}
      REGISTRATION_VERIFICATION_CODE: ""
      SMTP_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

secrets:
  lanverse_media_provider_master_key:
    file: ${LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE:?LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE is required}
