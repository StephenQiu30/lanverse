# Application services for a later containerized deployment.
# Local development starts processes directly against existing host services.
# App services only; dependency services live in docker-compose-env.yml.
name: lanverse

services:
  frontend:
    build: ./frontend
    image: lanverse/frontend:local
    ports:
      - "${LV_FRONTEND_PORT:-3000}:3000"

  backend-api:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=api"]
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_HTTP_ADDR: ":8080"
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the backend API}
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the backend API}
      LV_SESSION_IDLE_TTL: ${LV_SESSION_IDLE_TTL:-12h}
      LV_SESSION_ABSOLUTE_TTL: ${LV_SESSION_ABSOLUTE_TTL:-168h}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the backend API}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the backend API}
      LV_OBJECT_STORAGE_ENDPOINT: ${LV_OBJECT_STORAGE_ENDPOINT:?Set LV_OBJECT_STORAGE_ENDPOINT for the backend API}
      LV_OBJECT_STORAGE_BUCKET: ${LV_OBJECT_STORAGE_BUCKET:?Set LV_OBJECT_STORAGE_BUCKET for the backend API}
      LV_OBJECT_STORAGE_ACCESS_KEY: ${LV_OBJECT_STORAGE_ACCESS_KEY:?Set LV_OBJECT_STORAGE_ACCESS_KEY for the backend API}
      LV_OBJECT_STORAGE_SECRET_KEY: ${LV_OBJECT_STORAGE_SECRET_KEY:?Set LV_OBJECT_STORAGE_SECRET_KEY for the backend API}
      LV_OBJECT_STORAGE_REGION: ${LV_OBJECT_STORAGE_REGION:-}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "${LV_BACKEND_PORT:-8080}:8080"

  backend-worker:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=worker", "--queues=flow"]
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_WORKER_HEALTH_ADDR: ":8081"
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the backend worker}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the backend worker}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the backend worker}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "${LV_WORKER_HEALTH_PORT:-8081}:8081"

  backend-worker-media:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=worker", "--queues=media"]
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,size=8g
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_WORKER_HEALTH_ADDR: ":8081"
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the media worker}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the media worker}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the media worker}
      LV_OBJECT_STORAGE_ENDPOINT: ${LV_OBJECT_STORAGE_ENDPOINT:?Set LV_OBJECT_STORAGE_ENDPOINT for the media worker}
      LV_OBJECT_STORAGE_BUCKET: ${LV_OBJECT_STORAGE_BUCKET:?Set LV_OBJECT_STORAGE_BUCKET for the media worker}
      LV_OBJECT_STORAGE_ACCESS_KEY: ${LV_OBJECT_STORAGE_ACCESS_KEY:?Set LV_OBJECT_STORAGE_ACCESS_KEY for the media worker}
      LV_OBJECT_STORAGE_SECRET_KEY: ${LV_OBJECT_STORAGE_SECRET_KEY:?Set LV_OBJECT_STORAGE_SECRET_KEY for the media worker}
      LV_OBJECT_STORAGE_REGION: ${LV_OBJECT_STORAGE_REGION:-}
      LV_MEDIA_RESULT_ALLOWED_ORIGINS: ${LV_MEDIA_RESULT_ALLOWED_ORIGINS:-}
      LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS: ${LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS:-false}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "${LV_MEDIA_WORKER_HEALTH_PORT:-8083}:8081"

  backend-relay:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=relay"]
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_RELAY_HEALTH_ADDR: ":8082"
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the backend relay}
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the backend relay}
      LV_KAFKA_BROKERS: ${LV_KAFKA_BROKERS:?Set LV_KAFKA_BROKERS for the backend relay}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "${LV_RELAY_HEALTH_PORT:-8082}:8082"

  agent-api:
    build: ./agent
    image: lanverse/agent:local
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
    ports:
      - "${LV_AGENT_PORT:-8090}:8090"

  agent-worker:
    build: ./agent
    image: lanverse/agent:local
    command: ["python", "-m", "app.main_worker"]
    environment:
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the agent worker}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the agent worker}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the agent worker}
