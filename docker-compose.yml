name: lanverse

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-service: &backend-service
  build: *backend-build
  image: lanverse/backend:development

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lanverse/frontend:development

  backend:
    <<: *backend-service

  postgres:
    image: postgres:16.15-alpine

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}"
        "$${MINIO_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
