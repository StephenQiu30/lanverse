name: lanverse-services

services:
  server:
    container_name: lanverse-server
    image: lanverse-backend:local
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://postgres:lanverse-development-only@host.docker.internal:5432/lanverse}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://host.docker.internal:6379/0}
      RABBITMQ_URL: ${CONTAINER_RABBITMQ_URL:-amqp://lanverse:lanverse-development-only@host.docker.internal:5672/}
      MINIO_ENDPOINT: ${CONTAINER_MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      INFRASTRUCTURE_TIMEOUT_SECONDS: ${INFRASTRUCTURE_TIMEOUT_SECONDS:-1.5}
      STORAGE_THREAD_LIMIT: ${STORAGE_THREAD_LIMIT:-4}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-2147483648}
      MEDIA_UPLOAD_TTL_SECONDS: ${MEDIA_UPLOAD_TTL_SECONDS:-900}
      MEDIA_ACCESS_TTL_SECONDS: ${MEDIA_ACCESS_TTL_SECONDS:-300}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS:-120}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-jwt-secret-change-before-production}
      JWT_ISSUER: ${JWT_ISSUER:-lanverse-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lanverse-web}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_CLAIM_SECONDS: ${OUTBOX_CLAIM_SECONDS:-60}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-1.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    container_name: lanverse-web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
