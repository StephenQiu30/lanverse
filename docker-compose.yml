name: lanverse

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-service: &backend-service
  build: *backend-build
  image: lanverse/backend:development

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lanverse/frontend:development

  backend:
    <<: *backend-service

  workflow-worker:
    <<: *backend-service
    entrypoint: ["/usr/local/bin/lanverse-workflow-worker"]
    healthcheck:
      disable: true

  event-worker:
    <<: *backend-service
    entrypoint: ["/usr/local/bin/lanverse-event-worker"]

  postgres:
    image: postgres:16.15-alpine

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}"
        "$${MINIO_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic lanverse.business.storygraph-version.v1
        --partitions 1 --replication-factor 1
        --config cleanup.policy=delete --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic lanverse.business.storygraph-version.dlq.v1
        --partitions 1 --replication-factor 1
        --config cleanup.policy=delete --config retention.ms=2592000000
