# Application services for a later containerized deployment.
# Local development starts processes directly against existing host services.
# backend-worker and backend-relay are added with M1-08 and M1-09.
name: lanverse

services:
  frontend:
    build: ./frontend
    image: lanverse/frontend:local
    ports:
      - "${LV_FRONTEND_PORT:-3000}:3000"

  backend-api:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=api"]
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_HTTP_ADDR: ":8080"
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the backend API}
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the backend API}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the backend API}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the backend API}
      LV_OBJECT_STORAGE_ENDPOINT: ${LV_OBJECT_STORAGE_ENDPOINT:?Set LV_OBJECT_STORAGE_ENDPOINT for the backend API}
      LV_OBJECT_STORAGE_BUCKET: ${LV_OBJECT_STORAGE_BUCKET:?Set LV_OBJECT_STORAGE_BUCKET for the backend API}
      LV_OBJECT_STORAGE_ACCESS_KEY: ${LV_OBJECT_STORAGE_ACCESS_KEY:?Set LV_OBJECT_STORAGE_ACCESS_KEY for the backend API}
      LV_OBJECT_STORAGE_SECRET_KEY: ${LV_OBJECT_STORAGE_SECRET_KEY:?Set LV_OBJECT_STORAGE_SECRET_KEY for the backend API}
      LV_OBJECT_STORAGE_REGION: ${LV_OBJECT_STORAGE_REGION:-}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "${LV_BACKEND_PORT:-8080}:8080"

  agent-api:
    build: ./agent
    image: lanverse/agent:local
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
    ports:
      - "${LV_AGENT_PORT:-8090}:8090"

  agent-worker:
    build: ./agent
    image: lanverse/agent:local
    command: ["python", "-m", "app.main_worker"]
    environment:
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the agent worker}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the agent worker}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the agent worker}
