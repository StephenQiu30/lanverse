name: lanverse-business

services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:lanverse-development-only@host.docker.internal:5432/lanverse}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://lanverse:lanverse-development-only@host.docker.internal:5672/}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
