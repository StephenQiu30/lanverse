# Development application stack; existing host middleware retains its data.
# Run independently: docker compose up -d --build
name: lanverse

services:
  frontend:
    container_name: lanverse-frontend
    build:
      context: ./frontend
      target: dev
    image: lanverse/frontend:latest
    init: true
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      LV_BACKEND_ORIGIN: "http://backend:18080"
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./frontend/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./frontend/eslint.config.mjs:/app/eslint.config.mjs:ro
      - ./frontend/tests:/app/tests:ro
      - frontend-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${LV_FRONTEND_PORT:-3200}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  backend:
    container_name: lanverse-backend
    build:
      context: ./backend
      target: dev
    image: lanverse/backend:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/src:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8081/healthz && curl -fsS http://127.0.0.1:8082/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    command: ["--role=all"]
    tmpfs:
      - /work:rw,noexec,nosuid,size=8g
    environment:
      LV_HOST_SERVICE_PORTS: ${LV_HOST_SERVICE_PORTS:-5432 6379 7233 9000 9092}
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_DEV_API_PROXY: "true"
      LV_WORKER_HEALTH_ADDR: ":8081"
      LV_RELAY_HEALTH_ADDR: ":8082"
      LV_KAFKA_BROKERS: ${LV_KAFKA_BROKERS:?Set LV_KAFKA_BROKERS for the backend relay}
      LV_WHISPER_ENDPOINT: ${LV_WHISPER_ENDPOINT:-}
      LV_MEDIA_RESULT_ALLOWED_ORIGINS: ${LV_MEDIA_RESULT_ALLOWED_ORIGINS:-}
      LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS: ${LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS:-false}
      LV_HTTP_ADDR: "127.0.0.1:8080"
      LV_PUBLIC_ORIGIN: ${LV_PUBLIC_ORIGIN:-http://127.0.0.1:${LV_FRONTEND_PORT:-3200}}
      LV_DB_DSN: ${LV_DB_DSN:?Set LV_DB_DSN for the backend API}
      LV_REDIS_URL: ${LV_REDIS_URL:?Set LV_REDIS_URL for the backend API}
      LV_SESSION_IDLE_TTL: ${LV_SESSION_IDLE_TTL:-12h}
      LV_SESSION_ABSOLUTE_TTL: ${LV_SESSION_ABSOLUTE_TTL:-168h}
      LV_TEMPORAL_ADDR: ${LV_TEMPORAL_ADDR:?Set LV_TEMPORAL_ADDR for the backend API}
      LV_TEMPORAL_NAMESPACE: ${LV_TEMPORAL_NAMESPACE:?Set LV_TEMPORAL_NAMESPACE for the backend API}
      LV_OBJECT_STORAGE_ENDPOINT: ${LV_OBJECT_STORAGE_ENDPOINT:?Set LV_OBJECT_STORAGE_ENDPOINT for the backend API}
      LV_OBJECT_STORAGE_BUCKET: ${LV_OBJECT_STORAGE_BUCKET:?Set LV_OBJECT_STORAGE_BUCKET for the backend API}
      LV_OBJECT_STORAGE_ACCESS_KEY: ${LV_OBJECT_STORAGE_ACCESS_KEY:?Set LV_OBJECT_STORAGE_ACCESS_KEY for the backend API}
      LV_OBJECT_STORAGE_SECRET_KEY: ${LV_OBJECT_STORAGE_SECRET_KEY:?Set LV_OBJECT_STORAGE_SECRET_KEY for the backend API}
      LV_OBJECT_STORAGE_REGION: ${LV_OBJECT_STORAGE_REGION:-}
      LV_OTEL_ENDPOINT: ${LV_OTEL_ENDPOINT:-}
    ports:
      - "127.0.0.1:${LV_BACKEND_PORT:-8080}:18080"

      - "127.0.0.1:${LV_WORKER_HEALTH_PORT:-8081}:8081"
      - "127.0.0.1:${LV_RELAY_HEALTH_PORT:-8082}:8082"

volumes:
  frontend-modules:
    name: lanverse-dev_frontend-modules
  frontend-next:
    name: lanverse-dev_frontend-next
