# Single Compose file for the whole local environment (OPS-01 §3, §6): app services
# plus middleware. Start with: make up (middleware only) or make app-up (everything).
# backend-worker, backend-relay and agent-worker are added with M1-08, M1-09 and M1-10.
name: lanverse

services:
  frontend:
    build: ./frontend
    image: lanverse/frontend:local
    ports:
      - "${LV_FRONTEND_PORT:-3000}:3000"

  backend-api:
    build: ./backend
    image: lanverse/backend:local
    command: ["--role=api"]
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
      LV_HTTP_ADDR: ":8080"
    ports:
      - "${LV_BACKEND_PORT:-8080}:8080"

  agent-api:
    build: ./agent
    image: lanverse/agent:local
    environment:
      LV_ENV: ${LV_ENV:-local}
      LV_LOG_LEVEL: ${LV_LOG_LEVEL:-info}
    ports:
      - "${LV_AGENT_PORT:-8090}:8090"

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: lanverse
      POSTGRES_PASSWORD: ${LV_PG_PASSWORD:-lanverse-local}
      POSTGRES_DB: lanverse
    ports:
      - "${LV_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanverse -d lanverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${LV_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${LV_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lanverse
      MINIO_ROOT_PASSWORD: ${LV_MINIO_PASSWORD:-lanverse-local}
    ports:
      - "${LV_MINIO_PORT:-9000}:9000"
      - "${LV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal persists to the same PostgreSQL instance in its own databases
  # (temporal, temporal_visibility), separate from the business database (DES-08 §9).
  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: lanverse
      POSTGRES_PWD: ${LV_PG_PASSWORD:-lanverse-local}
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: lanverse-local
    ports:
      - "${LV_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${LV_TEMPORAL_UI_PORT:-8233}:8080"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: lanverse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${LV_KAFKA_UI_PORT:-8088}:8080"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
