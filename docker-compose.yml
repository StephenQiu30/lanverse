name: lanverse

x-application: &application
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

x-agent-environment: &agent-environment
  AGENT_EXECUTION_SECRET: ${AGENT_EXECUTION_SECRET:?Set the Harness authorization secret}
  CODEX_HOME: /home/lanverse/.codex
  CREATION_DATABASE_URL: ${CREATION_DATABASE_URL:?Set the existing dedicated Creation database URL}
  CREATION_AGENT_SECRET: ${CREATION_AGENT_SECRET:?Set the independent Creation authorization secret}
  CREATION_PLATFORM_URL: http://backend:8686
  CREATION_HARNESS_URL: http://agent:8787
  CREATION_HARNESS_SECRET: ${AGENT_EXECUTION_SECRET:?Set the Harness authorization secret}
  CREATION_TEXT_RELEASE_HASH: ${CREATION_TEXT_RELEASE_HASH:?Set the reviewed frozen text release hash}
  CREATION_CALL_LIMIT: ${CREATION_CALL_LIMIT:-1000}
  CREATION_INVOCATION_TIMEOUT_SECONDS: ${CREATION_INVOCATION_TIMEOUT_SECONDS:-900}
  CREATION_TEMPORAL_ADDRESS: host.docker.internal:7233
  CREATION_TEMPORAL_NAMESPACE: ${CREATION_TEMPORAL_NAMESPACE:-default}
  CREATION_TASK_QUEUE: ${CREATION_TASK_QUEUE:-lanverse-creation-text}
  CREATION_TEMPORAL_TLS: "false"
  CREATION_DOCKER_NETWORK: "true"

services:
  frontend:
    <<: *application
    container_name: lanverse-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8686}
    image: lanverse/frontend:development
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8123}:8123
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *application
    container_name: lanverse-backend
    build: ./backend
    image: lanverse/backend:development
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOGSTASH_ADDRESS: ${LOGSTASH_ADDRESS:-host.docker.internal:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8123","http://127.0.0.1:8123"]}
      DATABASE_URL: ${DATABASE_URL:?Set the existing local database URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-jwt-secret-change-before-production}
      JWT_ISSUER: ${JWT_ISSUER:-lanverse-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lanverse-web}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      REGISTRATION_VERIFICATION_CODE: ${REGISTRATION_VERIFICATION_CODE-123456}
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Lanverse}
      CREATION_AGENT_URL: http://agent:8787
      CREATION_DOCKER_NETWORK: "true"
      CREATION_AGENT_RELOCATED_FROM: ${CREATION_AGENT_RELOCATED_FROM:-}
      CREATION_AGENT_SECRET: ${CREATION_AGENT_SECRET:-}
      AGENT_URL: http://agent:8787
      AGENT_EXECUTION_SECRET: ${AGENT_EXECUTION_SECRET:-development-only-agent-execution-secret}
      AGENT_RUNTIME_IMAGE_DIGEST: ${AGENT_RUNTIME_IMAGE_DIGEST:-sha256:352d46c51661e7d989b42ddeb0a0ff0a4b48165e8e3f7700f3e60d170e4c58cb}
      AGENT_RUNTIME_ADDITIONAL_REVISIONS: ${AGENT_RUNTIME_ADDITIONAL_REVISIONS:-[]}
      AGENT_POLL_INTERVAL_MS: ${AGENT_POLL_INTERVAL_MS:-500}
      REVIEW_CLAIM_LEASE_SECONDS: ${REVIEW_CLAIM_LEASE_SECONDS:-300}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-host.docker.internal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-lanverse-production-workflow}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      EVENT_WORKER_HOST: 127.0.0.1
      EVENT_WORKER_PORT: 8687
      KAFKA_BROKERS: ${KAFKA_BROKERS:-host.docker.internal:19093}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://host.docker.internal:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME-lanverse_dev}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD-lanverse-development-elasticsearch}
    ports:
      - 127.0.0.1:${API_PORT:-8686}:8686
    networks:
      - edge
      - runtime
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev,mode=0711
    secrets:
      - source: lanverse_media_provider_master_key
        target: lanverse_media_provider_master_key_source
    healthcheck:
      test: ["CMD", "su-exec", "lanverse:lanverse", "wget", "--quiet", "--spider", "http://127.0.0.1:8686/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  agent:
    <<: *application
    container_name: lanverse-agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: lanverse/agent:local
    environment: *agent-environment
    volumes:
      - codex-state:/home/lanverse/.codex
      - type: bind
        source: ${LANVERSE_CODEX_AUTH_FILE:?Set the local Codex auth.json path}
        target: /home/lanverse/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false
    networks: [runtime]
    stop_grace_period: 960s

networks:
  edge:
    driver: bridge
  runtime:
    driver: bridge

secrets:
  lanverse_media_provider_master_key:
    file: ${LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE:-/dev/null}

volumes:
  codex-state:
