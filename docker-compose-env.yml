name: lanverse-env

services:
  postgres:
    image: postgres:16.15-alpine
    profiles: ["bundled-postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanverse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanverse-development-only}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    networks:
      - environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["bundled-minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-http://localhost:8123,http://127.0.0.1:8123}
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    networks:
      - environment
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["bundled-minio"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}"
        "$${MINIO_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
    networks:
      - environment
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  temporal:
    image: temporalio/temporal@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e
    profiles: ["bundled-temporal"]
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - 127.0.0.1:${TEMPORAL_PORT:-7233}:7233
      - 127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233
    networks:
      - environment
    volumes:
      - temporal-data:/home/temporal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    profiles: ["bundled-kafka"]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,PLAINTEXT_INTERNAL:SASL_PLAINTEXT,PLAINTEXT_HOST:SASL_PLAINTEXT,PLAINTEXT_DOCKER:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT_DOCKER://host.docker.internal:${KAFKA_DOCKER_PORT:-19093},PLAINTEXT_INTERNAL://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:19093,PLAINTEXT_INTERNAL://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_admin="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}";
      KAFKA_LISTENER_NAME_PLAINTEXT__INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_admin="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_event_worker="${KAFKA_EVENT_WORKER_PASSWORD:-lanverse-development-event-worker}";
      KAFKA_LISTENER_NAME_PLAINTEXT__HOST_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_admin="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_event_worker="${KAFKA_EVENT_WORKER_PASSWORD:-lanverse-development-event-worker}";
      KAFKA_LISTENER_NAME_PLAINTEXT__DOCKER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_admin="${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}"
        user_event_worker="${KAFKA_EVENT_WORKER_PASSWORD:-lanverse-development-event-worker}";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
      - 127.0.0.1:${KAFKA_DOCKER_PORT:-19093}:19093
    networks:
      - environment
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./backend/observability/kafka/healthcheck.sh:/usr/share/lanverse-observability/kafka-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/usr/share/lanverse-observability/kafka-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["bundled-kafka"]
    entrypoint: ["/usr/share/lanverse-observability/kafka-init.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-lanverse-development-kafka-admin}
    networks:
      - environment
    volumes:
      - ./backend/observability/kafka/init.sh:/usr/share/lanverse-observability/kafka-init.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    profiles: ["bundled-elasticsearch"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200
    networks:
      - environment
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    profiles: ["bundled-elasticsearch"]
    entrypoint: ["/usr/share/lanverse-observability/elasticsearch-init.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    networks:
      - environment
    volumes:
      - ./backend/observability/elasticsearch/init.sh:/usr/share/lanverse-observability/elasticsearch-init.sh:ro
      - ./backend/observability/elasticsearch/ilm-policy.json:/usr/share/lanverse-observability/ilm-policy.json:ro
      - ./backend/observability/logstash/template/lanverse-logs-template.json:/usr/share/lanverse-observability/lanverse-logs-template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.4
    profiles: ["bundled-logstash"]
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL:-http://host.docker.internal:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME-lanverse_dev}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD-lanverse-development-elasticsearch}
    ports:
      - 127.0.0.1:${LOGSTASH_PORT:-5000}:5000
    networks:
      - environment
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./backend/observability/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./backend/observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash-data:/usr/share/logstash/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9600/_node/pipelines >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.4
    profiles: ["bundled-kibana"]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - 127.0.0.1:${KIBANA_PORT:-5601}:5601
    networks:
      - environment
    volumes:
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  kibana-init:
    image: docker.elastic.co/kibana/kibana:9.4.4
    profiles: ["bundled-kibana"]
    entrypoint: ["/usr/share/lanverse-observability/kibana-init.sh"]
    environment:
      KIBANA_URL: http://kibana:5601
    networks:
      - environment
    volumes:
      - ./backend/observability/kibana/init.sh:/usr/share/lanverse-observability/kibana-init.sh:ro
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"

networks:
  environment:
    name: lanverse-environment
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  temporal-data:
  kafka-data:
  elasticsearch-data:
  logstash-data:
  kibana-data:
