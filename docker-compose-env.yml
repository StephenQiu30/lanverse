x-agent-environment: &agent-environment
  APP_NAME: Lanverse API
  ENVIRONMENT: development
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8686
  CORS_ORIGINS: '["http://localhost:8123","http://127.0.0.1:8123"]'
  DATABASE_URL: >-
    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanverse-development-only}@postgres:5432/${POSTGRES_DB:-lanverse}
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: 127.0.0.1:${MINIO_PORT:-9000}
  MINIO_PUBLIC_SECURE: "false"
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
  MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
  MINIO_SECURE: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-jwt-secret-change-before-production}
  EMAIL_VERIFICATION_HMAC_SECRET: ${EMAIL_VERIFICATION_HMAC_SECRET:-development-only-registration-hmac-change-before-production}
  SMTP_ENABLED: "false"

x-agent-runtime: &agent-runtime
  environment: *agent-environment
  networks:
    - internal

services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8686}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8686}
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8123}:8123
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy

  agent-init:
    <<: *agent-runtime
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  agent-api:
    <<: *agent-runtime
    depends_on:
      agent-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8686/readyz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  backend:
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8686
      LEGACY_API_URL: http://agent-api:8686
      MIGRATION_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lanverse-development-only}@postgres:5432/${POSTGRES_DB:-lanverse}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-3}
    ports:
      - 127.0.0.1:${API_PORT:-8686}:8686
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8686/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  schedule-dispatcher:
    <<: *agent-runtime
    depends_on:
      agent-init:
        condition: service_completed_successfully

  outbox-publisher:
    <<: *agent-runtime
    environment:
      <<: *agent-environment
      OUTBOX_TOPICS: ${OUTBOX_TOPICS:-lanverse.io.v1,lanverse.media.v1}
    depends_on:
      agent-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  io-worker:
    <<: *agent-runtime
    depends_on:
      agent-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  media-worker:
    <<: *agent-runtime
    depends_on:
      agent-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanverse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanverse-development-only}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  redis:
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    networks:
      - internal
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lanverse-development-only}
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    networks:
      - edge
      - internal
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lanverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lanverse-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-lanverse-media}
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  kafka:
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    networks:
      - internal
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-init:
    networks:
      - internal
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
