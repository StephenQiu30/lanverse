name: Workspace knowledge base

on:
  pull_request:
    paths: &knowledge_paths
      - "workspace/**"
      - ".obsidian/**"
      - ".github/workflows/workspace.yml"
      - "AGENTS.md"
      - "PROJECT.md"
      - "BACKLOG.md"
      - "README.md"
      - "DESIGN.md"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "design-qa.md"
      - "LICENSE"
  push:
    branches: [main]
    paths: *knowledge_paths

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec tsx --test tests/*.test.ts
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm exec next build --webpack
      - run: pnpm exec pagefind --site .next/server/app --output-path public/_pagefind
