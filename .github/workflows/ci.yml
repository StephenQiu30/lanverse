name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: lanverse_ci
          POSTGRES_USER: lanverse_ci
          POSTGRES_PASSWORD: lanverse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanverse_ci -d lanverse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Start real Temporal service
        run: |
          docker run --detach --name lanverse-ci-temporal --publish 7233:7233 \
            temporalio/temporal@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e \
            server start-dev --ip 0.0.0.0 --db-filename /tmp/temporal.db
          for attempt in {1..30}; do
            if docker exec lanverse-ci-temporal temporal operator cluster health --address 127.0.0.1:7233; then
              exit 0
            fi
            sleep 1
          done
          docker logs lanverse-ci-temporal
          exit 1
      - name: Start private MinIO service
        run: |
          docker run --detach --name lanverse-ci-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=lanverse_ci --env MINIO_ROOT_PASSWORD=lanverse_ci_minio_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address :9000 --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs lanverse-ci-minio
          exit 1
      - name: Start real Kafka and ELK services
        env:
          COMPOSE_PROFILES: bundled-kafka,bundled-elasticsearch,bundled-kibana,bundled-logstash
          DOCKER_KAFKA_BROKERS: kafka:19092
          DOCKER_ELASTICSEARCH_URL: http://elasticsearch:9200
          KAFKA_PORT: 19092
          LOGSTASH_PORT: 15000
          ELASTICSEARCH_PORT: 19200
          KIBANA_PORT: 15601
          KAFKA_ADMIN_PASSWORD: lanverse-ci-kafka-admin
          KAFKA_EVENT_WORKER_PASSWORD: lanverse-ci-event-worker
        run: |
          environment_compose() { docker compose -p lanverse-ci-env -f docker-compose-env.yml "$@"; }
          environment_compose up --detach --wait --wait-timeout 300 kafka elasticsearch logstash kibana
          environment_compose up --detach kafka-init kibana-init
          for init_service in kafka-init kibana-init; do
            init_container=$(environment_compose ps --all --quiet "$init_service")
            test -n "$init_container"
            test "$(docker wait "$init_container")" = 0
          done
          environment_compose exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 \
            --command-config /tmp/lanverse-kafka-health.properties \
            --entity-type topics --entity-name lanverse.business.script-version.published --describe \
            | grep -q 'retention.ms=604800000'
          environment_compose exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 \
            --command-config /tmp/lanverse-kafka-health.properties \
            --entity-type topics --entity-name lanverse.business.script-version.dead-letter --describe \
            | grep -q 'retention.ms=2592000000'
          environment_compose exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 \
            --command-config /tmp/lanverse-kafka-health.properties \
            --entity-type topics --entity-name lanverse.business.storygraph-version.published --describe \
            | grep -q 'retention.ms=604800000'
          environment_compose exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 \
            --command-config /tmp/lanverse-kafka-health.properties \
            --entity-type topics --entity-name lanverse.business.storygraph-version.dead-letter --describe \
            | grep -q 'retention.ms=2592000000'
          ! environment_compose exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --command-config /tmp/lanverse-kafka-health.properties --list \
            | grep -qi command
          test "$(curl --fail --silent http://127.0.0.1:19200 | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["number"])')" = "9.4.4"
          curl --fail --silent http://127.0.0.1:19200/_ilm/policy/lanverse-logs-application-30d >/dev/null
          curl --fail --silent http://127.0.0.1:19200/_index_template/lanverse-logs-application >/dev/null
          curl --fail --silent http://127.0.0.1:15601/api/data_views/data_view/lanverse-logs-application >/dev/null
      - name: Check and test Go backend
        working-directory: backend
        env:
          LANVERSE_TEST_DATABASE_URL: postgresql://lanverse_ci:lanverse_ci@127.0.0.1:5432/lanverse_ci?sslmode=disable
          LANVERSE_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
          LANVERSE_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          LANVERSE_TEST_MINIO_ACCESS_KEY: lanverse_ci
          LANVERSE_TEST_MINIO_SECRET_KEY: lanverse_ci_minio_secret
          LANVERSE_TEST_MINIO_BUCKET: lanverse-asset-ci
          LANVERSE_TEST_KAFKA_BROKERS: 127.0.0.1:19092
          LANVERSE_TEST_KAFKA_USERNAME: admin
          LANVERSE_TEST_KAFKA_PASSWORD: lanverse-ci-kafka-admin
          LANVERSE_TEST_KAFKA_ADMIN_PASSWORD: lanverse-ci-kafka-admin
          LANVERSE_TEST_KAFKA_EVENT_WORKER_PASSWORD: lanverse-ci-event-worker
          LANVERSE_TEST_KAFKA_SCRIPT_TOPIC: lanverse.business.script-version.published
          LANVERSE_TEST_KAFKA_SCRIPT_DLQ_TOPIC: lanverse.business.script-version.dead-letter
          LANVERSE_TEST_KAFKA_STORYGRAPH_TOPIC: lanverse.business.storygraph-version.published
          LANVERSE_TEST_KAFKA_STORYGRAPH_DLQ_TOPIC: lanverse.business.storygraph-version.dead-letter
          LANVERSE_TEST_ELASTICSEARCH_URL: http://127.0.0.1:19200
          LANVERSE_TEST_KIBANA_URL: http://127.0.0.1:15601
          LANVERSE_TEST_LOGSTASH_ADDRESS: 127.0.0.1:15000
        run: |
          set -o pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -json -count=1 -p 1 ./... | tee "$RUNNER_TEMP/lanverse-backend-tests.json"
          python3 ../.github/scripts/verify-go-test-skips.py "$RUNNER_TEMP/lanverse-backend-tests.json"

  agent:
    name: Agent / Candidate Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -e '.[dev]'
      - name: Check and test Python Agent
        working-directory: agent
        run: |
          ruff check app tests
          ruff format --check app tests
          pyright app tests
          pytest -q

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate current API client
        working-directory: frontend
        run: npm run openapi2ts
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi:
    name: API / Generated Client Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate API client from Backend contract
        working-directory: frontend
        run: npm run openapi2ts
      - name: Ensure generated client is committed
        run: git diff --exit-code -- frontend/src/api

  deployment:
    name: Deployment / Images and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate development and production Compose
        env:
          LANVERSE_FRONTEND_IMAGE: lanverse/frontend:ci
          LANVERSE_BACKEND_IMAGE: lanverse/backend:ci
          POSTGRES_PASSWORD: ci-compose-only
          JWT_SECRET_KEY: ci-compose-only-jwt
          AGENT_URL: http://agent.example.test
          AGENT_EXECUTION_SECRET: ci-compose-only-agent
          AGENT_RUNTIME_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TEMPORAL_ADDRESS: temporal.example.test:7233
          MINIO_PUBLIC_ENDPOINT: media.example.test
          MINIO_ACCESS_KEY: ci-compose-only
          MINIO_SECRET_KEY: ci-compose-only-secret
          KAFKA_ADMIN_PASSWORD: ci-compose-only-kafka-admin
          KAFKA_EVENT_WORKER_PASSWORD: ci-compose-only-event-worker
          LANVERSE_CORS_ORIGINS: '["https://app.example.test"]'
          MINIO_CORS_ORIGINS: https://app.example.test
          LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE: /tmp/lanverse-ci-media-provider-master-key
        run: |
          umask 077
          openssl rand -out "$LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE" 32
          echo "LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE=$LANVERSE_MEDIA_PROVIDER_MASTER_KEY_FILE" >> "$GITHUB_ENV"
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-env.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose-env.yml -f docker-compose-prod.yml config --quiet
          test "$(docker compose -f docker-compose.yml config --services | sort | tr '\n' ' ')" = "backend frontend "
          test -z "$(docker compose -f docker-compose-env.yml config --services)"
      - name: Build Frontend deployment image
        run: docker build --tag lanverse/frontend:ci frontend
      - name: Build Backend deployment image
        run: docker build --tag lanverse/backend:ci backend
      - name: Build Agent deployment image
        run: docker build --file agent/Dockerfile --tag lanverse/agent:ci .
      - name: Require Backend binaries
        run: >-
          docker run --rm --entrypoint /bin/sh lanverse/backend:ci -c
          'test -x /usr/local/bin/lanverse &&
          test ! -e /usr/local/bin/lanverse-api &&
          test ! -e /usr/local/bin/lanverse-workflow-worker &&
          test ! -e /usr/local/bin/lanverse-event-worker'
      - name: Require Frontend standalone runtime
        run: >-
          docker run --rm --entrypoint /bin/sh lanverse/frontend:ci -c
          'test -f /srv/lanverse/frontend/server.js && test -d /srv/lanverse/frontend/.next/static'
      - name: Require private Agent candidate runtime
        run: |
          docker run --rm --entrypoint /bin/sh lanverse/agent:ci -c '
            test "$(id -u)" -ne 0
            command -v codex >/dev/null
            codex --version | grep -q "0.147.0"
            test -d skills/build-storygraph
            test "$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
            test ! -e /srv/lanverse/.agents
            test -z "$(find skills -name openai.yaml -print -quit)"
            python -c "from app.candidate_runtime.api import app; from app.modules.storygraph.bundle import StoryGraphBundle; assert app.title == '\''Lanverse Candidate Runtime'\''; StoryGraphBundle().verify_installed_bundle()"
          '
      - name: Run deployment images against real dependencies
        env:
          COMPOSE_PROFILES: bundled-minio,bundled-postgres,bundled-temporal,bundled-kafka,bundled-elasticsearch,bundled-kibana,bundled-logstash
          POSTGRES_HOST: host.docker.internal
          MINIO_ENDPOINT: host.docker.internal:9000
          DOCKER_TEMPORAL_ADDRESS: host.docker.internal:7233
          DOCKER_KAFKA_BROKERS: host.docker.internal:19093
          ELASTIC_OBSERVABILITY_NETWORK: lanverse-environment
          DOCKER_ELASTICSEARCH_URL: http://elasticsearch:9200
          DOCKER_LOGSTASH_ADDRESS: logstash:5000
          DOCKER_KIBANA_URL: http://kibana:5601
          KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
          KAFKA_USERNAME: event_worker
          KAFKA_PASSWORD: lanverse-development-event-worker
          ELASTICSEARCH_USERNAME: ""
          ELASTICSEARCH_PASSWORD: ""
        run: |
          environment_compose() { docker compose -p lanverse-ci-env -f docker-compose-env.yml "$@"; }
          service_compose() { docker compose -p lanverse-ci -f docker-compose.yml "$@"; }
          export AGENT_RUNTIME_IMAGE_DIGEST="$(docker image inspect --format '{{.Id}}' lanverse/agent:ci)"
          test -n "$AGENT_RUNTIME_IMAGE_DIGEST"
          docker tag lanverse/frontend:ci lanverse/frontend:development
          docker tag lanverse/backend:ci lanverse/backend:development
          environment_compose up --detach --no-build --wait --wait-timeout 240 \
            postgres minio temporal kafka elasticsearch logstash kibana
          environment_compose up --detach --no-build minio-init kafka-init kibana-init
          for init_service in minio-init kafka-init kibana-init; do
            init_container=$(environment_compose ps --all --quiet "$init_service")
            test -n "$init_container"
            test "$(docker wait "$init_container")" = 0
          done
          service_compose up --detach --no-build --wait --wait-timeout 240 frontend backend
          service_compose ps --status running --services | grep -qx backend
          service_compose exec -T backend /bin/sh -c '
            set -- $(grep "^Uid:" /proc/1/status)
            test "$2" = "$(id -u lanverse)"
            first_arg=$(tr "\000" "\n" < /proc/1/cmdline | head -n 1)
            test "$first_arg" = /usr/local/bin/lanverse
          '
          service_compose exec -T --user lanverse backend /bin/sh -c '
            test "$(stat -f -c %T /run/secrets)" = tmpfs
            test -f /run/secrets/lanverse_media_provider_master_key
            test "$(stat -c %a /run/secrets/lanverse_media_provider_master_key)" = 400
            test "$(stat -c %U:%G /run/secrets/lanverse_media_provider_master_key)" = lanverse:lanverse
            test "$(wc -c < /run/secrets/lanverse_media_provider_master_key)" -eq 32
          '
          environment_compose ps --status running --services | grep -qx logstash
          environment_compose ps --status running --services | grep -qx kibana
          for attempt in $(seq 1 30); do
            if service_compose logs --no-color backend | grep -q "lanverse workflow worker started"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              service_compose logs --no-color backend
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if service_compose logs --no-color backend | grep -q "lanverse event worker started"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              service_compose logs --no-color backend
              exit 1
            fi
            sleep 1
          done
          service_compose exec -T backend \
            wget --quiet --spider http://127.0.0.1:8687/readyz
          test_email=ci-logging-faults@example.test
          curl --fail --silent --show-error --request POST http://127.0.0.1:8686/api/v1/auth/registration-verifications \
            --header 'Content-Type: application/json' --data-binary "{\"email\":\"$test_email\"}" >/dev/null
          registration_ticket=$(curl --fail --silent --show-error --request POST \
            http://127.0.0.1:8686/api/v1/auth/registration-verifications/confirm \
            --header 'Content-Type: application/json' \
            --data-binary "{\"email\":\"$test_email\",\"code\":\"123456\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["registration_ticket"])')
          auth_result=$(curl --fail --silent --show-error --request POST http://127.0.0.1:8686/api/v1/auth/register \
            --header 'Content-Type: application/json' \
            --data-binary "{\"registration_ticket\":\"$registration_ticket\",\"password\":\"ci-logging-password-123\",\"display_name\":\"CI Logging\"}")
          access_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])' <<<"$auth_result")
          workspace_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["workspace"]["id"])' <<<"$auth_result")
          create_project_during_fault() {
            local fault_name=$1
            local project_result
            project_result=$(curl --fail --silent --show-error --request POST http://127.0.0.1:8686/api/v1/projects \
              --header 'Content-Type: application/json' --header "Authorization: Bearer $access_token" \
              --data-binary "{\"workspace_id\":\"$workspace_id\",\"name\":\"Logging fault $fault_name\",\"idempotency_key\":\"ci-logging-fault-$fault_name\"}")
            python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["status"] == "active"; assert data["revision"] == 1' <<<"$project_result"
          }
          log_request_id=5cffb37f-79b1-42f9-9e34-c55b1d8e9702
          curl --fail --silent --show-error \
            --header "X-Request-ID: $log_request_id" \
            --header 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01' \
            --output /dev/null 'http://127.0.0.1:8686/healthz?token=ci-sensitive-query-value'
          for attempt in $(seq 1 60); do
            log_result=$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:9200/lanverse-logs-application/_search \
              --header 'Content-Type: application/json' \
              --data-binary "{\"query\":{\"term\":{\"request_id\":\"$log_request_id\"}},\"size\":1}")
            if python3 -c 'import json,sys; result=json.load(sys.stdin); source=result["hits"]["hits"][0]["_source"]; assert source["service"] == "lanverse-backend"; assert source["event"] == "http_request"; assert source["trace_id"] == "4bf92f3577b34da6a3ce929d0e0e4736"; assert source["route"] == "/healthz"; assert "ci-sensitive-query-value" not in json.dumps(source)' <<<"$log_result" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              service_compose logs --no-color backend
              environment_compose logs --no-color logstash
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5601/api/data_views/data_view/lanverse-logs-application >/dev/null
          search_index_before=$(curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-storygraph-search | python3 -c 'import json,sys; print(next(iter(json.load(sys.stdin))))')
          for logging_service in logstash kibana; do
            environment_compose stop "$logging_service"
            service_compose exec -T backend \
              wget --quiet --spider http://127.0.0.1:8686/healthz
            service_compose exec -T backend \
              wget --quiet --spider http://127.0.0.1:8687/readyz
            service_compose ps --status running --services | grep -qx backend
            create_project_during_fault "$logging_service"
            search_index_after=$(curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-storygraph-search | python3 -c 'import json,sys; print(next(iter(json.load(sys.stdin))))')
            test "$search_index_after" = "$search_index_before"
            environment_compose up --detach --no-build --wait --wait-timeout 180 "$logging_service"
          done
          environment_compose stop kafka
          if service_compose exec -T backend \
            wget --quiet --spider http://127.0.0.1:8687/readyz; then
            echo 'backend event runtime stayed ready while Kafka was unavailable' >&2
            exit 1
          fi
          service_compose ps --status running --services | grep -qx backend
          service_compose exec -T backend \
            wget --quiet --spider http://127.0.0.1:8686/healthz
          service_compose ps --status running --services | grep -qx backend
          create_project_during_fault kafka
          environment_compose start kafka
          for attempt in $(seq 1 60); do
            if service_compose exec -T backend \
              wget --quiet --spider http://127.0.0.1:8687/readyz; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              service_compose logs --no-color backend
              environment_compose logs --no-color kafka
              exit 1
            fi
            sleep 1
          done
          environment_compose exec -T elasticsearch \
            curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-script-search >/dev/null
          environment_compose exec -T elasticsearch \
            curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-storygraph-search >/dev/null
          environment_compose stop elasticsearch
          if service_compose exec -T backend \
            wget --quiet --spider http://127.0.0.1:8687/readyz; then
            echo 'backend event runtime stayed ready while Elasticsearch was unavailable' >&2
            exit 1
          fi
          service_compose exec -T backend \
            wget --quiet --spider http://127.0.0.1:8686/healthz
          service_compose ps --status running --services | grep -qx backend
          create_project_during_fault elasticsearch
          environment_compose start elasticsearch
          for attempt in $(seq 1 60); do
            if service_compose exec -T backend \
              wget --quiet --spider http://127.0.0.1:8687/readyz; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              service_compose logs --no-color backend
              environment_compose logs --no-color elasticsearch
              exit 1
            fi
            sleep 1
          done
          recovery_request_id=649899b8-2702-474f-a0b8-71aa696b10d8
          curl --fail --silent --show-error --header "X-Request-ID: $recovery_request_id" \
            --output /dev/null http://127.0.0.1:8686/healthz
          for attempt in $(seq 1 60); do
            recovery_count=$(curl --fail --silent --show-error \
              "http://127.0.0.1:9200/lanverse-logs-application/_count?q=request_id:$recovery_request_id" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])' 2>/dev/null || echo 0)
            if [ "$recovery_count" -gt 0 ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              service_compose logs --no-color backend
              environment_compose logs --no-color logstash kafka elasticsearch
              exit 1
            fi
            sleep 1
          done
          docker run --detach --name lanverse-ci-agent-runtime --publish 127.0.0.1:18787:8787 --env AGENT_EXECUTION_SECRET=ci-agent-runtime-secret-at-least-32-bytes lanverse/agent:ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:8686/healthz
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:8123/
          agent_health=$(curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:18787/healthz)
          python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["status"] == "ok"; assert value["skill_bundle_hash"] == "352d46c51661e7d989b42ddeb0a0ff0a4b48165e8e3f7700f3e60d170e4c58cb"' <<<"$agent_health"
      - name: Clean deployment runtime
        if: always()
        env:
          COMPOSE_PROFILES: bundled-minio,bundled-postgres,bundled-temporal,bundled-kafka,bundled-elasticsearch,bundled-kibana,bundled-logstash
        run: |
          docker rm --force lanverse-ci-agent-runtime 2>/dev/null || true
          docker compose -p lanverse-ci -f docker-compose.yml down --volumes --remove-orphans
          docker compose -p lanverse-ci-env -f docker-compose-env.yml down --volumes --remove-orphans
          unlink /tmp/lanverse-ci-media-provider-master-key 2>/dev/null || true

  delivery:
    name: Delivery / Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, agent, frontend, openapi]
    steps:
      - uses: actions/checkout@v6
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|log)$|data/|logs/|playwright-report/|test-results/)' | grep -v -E '\.env(\.production)?\.example$'; then
            echo 'tracked secret/data/report artifact detected' >&2
            exit 1
          fi
          test -f backend/go.mod
          test -f agent/pyproject.toml
          ! find backend -type f \( -name '*.py' -o -name 'pyproject.toml' \) -print -quit | grep -q .
          ! find agent -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print -quit | grep -q .

  required:
    name: Required / CI
    if: ${{ always() }}
    needs: [backend, agent, frontend, openapi, deployment, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project boundary to pass
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.agent.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.openapi.result }}" = success
          test "${{ needs.deployment.result }}" = success
          test "${{ needs.delivery.result }}" = success
