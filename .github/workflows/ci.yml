name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_test?sslmode=disable
      LV_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      LV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanverse_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lanverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanverse_test -d lanverse_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Keep backend tests outside production source
        run: |
          test_file="$(find . -type f -name '*_test.go' ! -path './tests/*' -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Go tests must live under backend/tests/: $test_file" >&2
            exit 1
          fi
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/google/wire/cmd/wire@v0.7.0
      - run: test -z "$(gofmt -l .)"
      - run: test -z "$(goimports -local github.com/StephenQiu30/lanverse/backend -l .)"
      - run: go vet ./...
      - run: golangci-lint run ./...
      - name: Install media probe tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: command -v ffmpeg && command -v ffprobe
      - name: Run backend Race tests
        shell: bash
        run: go test -race -count=1 -json ./... | tee "$RUNNER_TEMP/backend-tests.jsonl"
      - name: Report backend test execution and skips
        if: always()
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["RUNNER_TEMP"]) / "backend-tests.jsonl"
          lines = ["## Backend Race tests", ""]
          if not results.exists():
              lines.append("Tests did not run; inspect the earlier failed step.")
          else:
              counts = collections.Counter()
              skipped = collections.Counter()
              for line in results.read_text().splitlines():
                  event = json.loads(line)
                  test = event.get("Test", "")
                  action = event["Action"]
                  if test and "/" not in test and action in ("pass", "fail", "skip"):
                      counts[action] += 1
                      if action == "skip":
                          skipped[event["Package"].rsplit("/", 1)[-1]] += 1
              lines.append(f"Top-level tests: {counts['pass']} passed, {counts['fail']} failed, {counts['skip']} skipped.")
              lines.extend(["", "Skipped tests are not acceptance evidence. Dedicated integration steps below have separate results."])
              if skipped:
                  lines.extend(["", "| Package | Skipped |", "| --- | ---: |"])
                  lines.extend(f"| {package} | {count} |" for package, count in sorted(skipped.items()))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Prepare isolated identity contract databases
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_gate_test'
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_bootstrap_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609270435_create_outbox.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271020_create_organization.up.sql
      - name: Verify identity PostgreSQL and Redis contracts
        env:
          LV_TEST_IDENTITY_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable
          LV_TEST_IDENTITY_REDIS_URL: redis://127.0.0.1:6379/14
        run: go test -race ./tests/identity -run '^Test(Identity|SessionStore|LoginLimiter|AuthenticateRejectsDisabledAccountWithRealPostgresAndRedis)' -count=1 -v
      - name: Verify first-admin bootstrap in its own database
        env:
          LV_TEST_BOOTSTRAP_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable
        run: go test -race ./tests/identity -run '^TestBootstrapAdminIsAtomicAndSingleUseWithRealPostgres$' -count=1 -v
      - name: Prepare isolated provider contract database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_catalog_provider_gate_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609270435_create_outbox.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271100_create_provider_credentials.up.sql
      - name: Verify provider PostgreSQL and administrator contracts
        env:
          LV_TEST_CATALOG_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable
        run: go test -race ./tests/catalog -run '^Test(ProviderRejectsInvalidSettingsAndDisablesOnce|CredentialKeepsCiphertextOutOfJSONAndValidatesTestOutcome|ProviderCredentialsWithRealPostgres|ConcurrentCredentialReplacementKeepsOneActive|CreateProviderCommitsAuditAndRejectsStaleAdminOnLocalPostgres|UpdateProviderCommitsEventsAndRejectsStaleAdminOnLocalPostgres|SetCredentialCommitsSealedDataAndEventsOnLocalPostgres|DisableCredentialCommitsSafeEventsAndRollsBackOnAuditFailure|ProviderDetailReadsSafeMetadataWithCurrentAdminOnLocalPostgres)$' -count=1 -v
      - name: Prepare PostgreSQL contract databases
        run: psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE ROLE lanverse_app'
      - name: Apply migrations for PostgreSQL contract tests
        run: find db/migrations -maxdepth 1 -name '*.up.sql' -print0 | sort -z | xargs -0 -n1 psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -f
      - name: Prepare isolated canvas contract databases
        run: |
          for database in lanverse_canvas_store_test lanverse_canvas_http_test; do
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            find db/migrations -maxdepth 1 -name '*.up.sql' -print0 | sort -z | xargs -0 -n1 psql "$contract_dsn" -v ON_ERROR_STOP=1 -f
          done
      - name: Verify canvas persistence and public HTTP contracts
        env:
          LV_TEST_CANVAS_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_canvas_store_test?sslmode=disable
          LV_TEST_CANVAS_HTTP_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_canvas_http_test?sslmode=disable
          LV_TEST_CANVAS_REDIS_URL: redis://127.0.0.1:6379/13
        run: go test -race ./tests/canvas -count=1 -v
      - name: Verify identity commands in isolated databases
        env:
          LV_TEST_IDENTITY_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          test_cases=(
            TestCreateUserCommitsAccountAndTwoOutboxEventsAtomically
            TestLoginUsesRealPostgresRedisAndAtomicAudit
            TestChangePasswordInvalidatesOtherSessionsWithRealPostgresRedis
            TestDisableUserCommitsStateAndEventsWithRealPostgresRedis
            TestAdminLifecycleRevokesSessionsAndRollsBackAuditFailureWithRealStores
            TestAdminDirectoryWithRealPostgres
          )
          for index in "${!test_cases[@]}"; do
            database="lanverse_identity_command_${index}"
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
              psql "$contract_dsn" -v ON_ERROR_STOP=1 -f "$migration"
            done
            LV_TEST_IDENTITY_DB_DSN="$contract_dsn" \
            LV_TEST_ACCOUNT_LIFECYCLE_DB_DSN="$contract_dsn" \
            LV_TEST_ACCOUNT_DIRECTORY_DB_DSN="$contract_dsn" \
            go test -race ./tests/identity -run "^${test_cases[$index]}$" -count=1 -v
          done
      - name: Verify catalog, billing, and workspace PostgreSQL contracts
        run: |
          for package in catalog billing workspace; do
            database="lanverse_${package}_contract"
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
              psql "$contract_dsn" -v ON_ERROR_STOP=1 -f "$migration"
            done
            LV_TEST_CATALOG_DB_DSN="$contract_dsn" \
            LV_TEST_MODEL_CATALOG_DB_DSN="$contract_dsn" \
            LV_TEST_BILLING_DB_DSN="$contract_dsn" \
            LV_TEST_WORKSPACE_DB_DSN="$contract_dsn" \
            go test -race "./tests/$package" -count=1 -v
          done
      - name: Verify operation PostgreSQL contracts
        run: LV_TEST_OPERATION_SCHEMA_DB_DSN="$LV_TEST_DB_DSN" LV_TEST_OPERATION_STORE_DB_DSN="$LV_TEST_DB_DSN" go test -race ./tests/operation -count=1
      - name: Prepare isolated media migration database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_media_migration_test'
          for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
            case "$migration" in
              *202609271180_create_media_asset.up.sql) break ;;
            esac
            psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_migration_test?sslmode=disable' -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify media PostgreSQL contracts
        run: |
          LV_TEST_MEDIA_STORE_DB_DSN="$LV_TEST_DB_DSN" \
          LV_TEST_MEDIA_MIGRATION_DB_DSN='postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_migration_test?sslmode=disable' \
          go test -race ./tests/media -count=1
      - name: Prepare private receipt and export contract storage
        env:
          CI_STORAGE_ACCESS_KEY: lanverse-ci-only
          CI_STORAGE_SECRET_KEY: ci-only-private-object-storage
        run: |
          # 使用固定社区源提交构建，不依赖镜像仓库的历史制品可用性。
          GOBIN="$RUNNER_TEMP/receipt-storage-bin" \
            go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
          mkdir -p "$RUNNER_TEMP/receipt-storage-data"
          MINIO_ROOT_USER="$CI_STORAGE_ACCESS_KEY" \
          MINIO_ROOT_PASSWORD="$CI_STORAGE_SECRET_KEY" \
            "$RUNNER_TEMP/receipt-storage-bin/minio" server \
            "$RUNNER_TEMP/receipt-storage-data" --address 127.0.0.1:19000 \
            >"$RUNNER_TEMP/receipt-storage.log" 2>&1 &
          echo "LV_CI_STORAGE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:19000/minio/health/live; then
              break
            fi
            sleep 0.5
          done
          curl --silent --show-error --fail --max-time 5 http://127.0.0.1:19000/minio/health/live
          curl --silent --show-error --fail --max-time 10 \
            --aws-sigv4 'aws:amz:us-east-1:s3' \
            --user "$CI_STORAGE_ACCESS_KEY:$CI_STORAGE_SECRET_KEY" \
            --header 'x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' \
            --request PUT http://127.0.0.1:19000/lanverse-receipt-test
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path(os.environ["RUNNER_TEMP"]) / "private-receipt-storage.json"
          config.touch(mode=0o600)
          config.write_text(json.dumps({
              "endpoint": "http://127.0.0.1:19000",
              "bucket": "lanverse-receipt-test",
              "access_key": os.environ["CI_STORAGE_ACCESS_KEY"],
              "secret_key": os.environ["CI_STORAGE_SECRET_KEY"],
          }))
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"LV_TEST_RECEIPT_STORAGE_CONFIG={config}\n")
          PY
      - name: Prepare isolated public tool contract database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_receipt'
          contract_dsn='postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable'
          find db/migrations -maxdepth 1 -name '*.up.sql' -print0 | sort -z | xargs -0 -n1 psql "$contract_dsn" -v ON_ERROR_STOP=1 -f
      - name: Verify template quotes and private provider receipts
        env:
          LV_TEST_OPERATION_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: go test -race ./tests/prompt ./tests/operation -count=1 -v
      - name: Verify actual private media exports and GLB under the runtime role
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_MEDIA_EXPORT_REQUIRE_ROLE: "1"
        run: go test -race ./tests/media -run '^Test(Export|GLB)' -count=1 -v
      - name: Verify complete project copy with PostgreSQL and private objects
        env:
          LV_TEST_WORKSPACE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_PROJECT_COPY_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: go test -race ./tests/workspace ./tests/canvas ./tests/media -run '^TestProjectCopy' -count=1 -v
      - name: Verify depth job PostgreSQL authority and private object contracts
        shell: bash
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          go test -race ./tests/media -run '^TestDepthJobPG' -count=1 -json | tee "$RUNNER_TEMP/depth-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "depth-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 9 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Depth job PostgreSQL contracts\n\n{counts['pass']} actual PostgreSQL/private-object tests passed, with no skips. Fixed-model MPS and real Temporal acceptance run separately; this Linux step does not prove native inference.\n")
          PY
      - name: Verify project folder and atomic copy placement under the runtime role
        shell: bash
        env:
          LV_TEST_FOLDER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_FOLDER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          go test -race ./tests/workspace -run '^TestProject(Folder|CopyPlacement)' -count=1 -json | tee "$RUNNER_TEMP/folder-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "folder-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 30 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Project folders and copy placement\n\n{counts['pass']} actual runtime-role PostgreSQL, permanent-receipt, atomic recycling, and physical-lock contracts passed without skips. Browser acceptance runs separately.\n")
          PY
      - name: Verify document originals and permanent project cover ownership
        shell: bash
        env:
          LV_TEST_DOCUMENT_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_DOCUMENT_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_COVER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_cover?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_COVER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_cover?sslmode=disable
          LV_TEST_FOLDER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_FOLDER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_cover'
          find db/migrations -maxdepth 1 -name '*.up.sql' -print0 | sort -z | xargs -0 -n1 psql "$LV_TEST_COVER_OWNER_DSN" -v ON_ERROR_STOP=1 -f
          go test -race -p 1 ./tests/media ./tests/workspace -run '^Test(Document|ProjectCover|ProjectCopy(Cover|Document))' -count=1 -json | tee "$RUNNER_TEMP/cover-document-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "cover-document-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 36 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Document originals and project cover\n\n{counts['pass']} document container, real original-object upload/download/copy, permanent lifecycle receipt and image ownership contracts passed without skips. Browser acceptance runs separately.\n")
          PY
      - name: Clean up isolated private contract storage
        if: always()
        run: |
          if [[ "${LV_CI_STORAGE_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "$LV_CI_STORAGE_PID" 2>/dev/null || true
          fi
      - name: Prepare isolated restricted-login audit database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE lanverse_runtime_test LOGIN INHERIT PASSWORD 'ci-only'"
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'GRANT lanverse_app TO lanverse_runtime_test'
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_audit_role_test'
          for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
            psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable' -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify audit contracts with a real restricted login
        env:
          LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_AUDIT_OWNER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_AUDIT_LOGIN_DB_DSN: postgres://lanverse_runtime_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
          LV_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: go test -race ./tests/db ./tests/app -run '^TestAuditRestrictedLogin' -count=1 -v
      - run: govulncheck ./...
      - run: wire ./internal/app
      - run: goimports -local github.com/StephenQiu30/lanverse/backend -w internal/app/wire_gen.go
      - run: git diff --exit-code -- internal/app/wire_gen.go
      - name: Install the module-pinned Swagger generator
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - name: Verify fresh Swagger artifacts without changing the checkout
        run: |
          swag init -g internal/app/public_api.go --parseInternal --parseDependency -o "$RUNNER_TEMP/swagger-contract/docs"
          git diff --no-index --exit-code -- docs "$RUNNER_TEMP/swagger-contract/docs"
      - name: Verify production public route and Swagger contracts
        run: go test -race ./tests/app -run '^Test(PublicRouterSwaggerContract|PublicSwaggerRejectsContractDrift|PublicSwaggerNormalizesPathParameters|SwaggerRuntimeDefaultsDoNotHideNonEmptyDrift)$' -count=1 -v
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - name: Verify the same-commit production API and fresh online client
        env:
          LV_ENV: local
          LV_ENV_FILE: ""
          LV_HTTP_ADDR: 127.0.0.1:18080
          LV_PUBLIC_ORIGIN: http://127.0.0.1:3000
          LV_API_BASE_URL: http://127.0.0.1:18080
          LV_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_test?sslmode=disable
          LV_REDIS_URL: redis://127.0.0.1:6379/12
          LV_TEMPORAL_ADDR: 127.0.0.1:7233
          LV_TEMPORAL_NAMESPACE: lanverse-contract
          LV_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          LV_OBJECT_STORAGE_BUCKET: lanverse-contract
          LV_OBJECT_STORAGE_ACCESS_KEY: ci-contract-only
          LV_OBJECT_STORAGE_SECRET_KEY: ci-contract-only
        run: |
          go build -trimpath -o "$RUNNER_TEMP/lanverse-contract" ./cmd/lanverse
          "$RUNNER_TEMP/lanverse-contract" --role=api >"$RUNNER_TEMP/public-contract-api.log" 2>&1 &
          contract_api_pid=$!
          cleanup() {
            kill "$contract_api_pid" 2>/dev/null || true
            wait "$contract_api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          contract_started=false
          for ((attempt = 0; attempt < 30; attempt++)); do
            if ! kill -0 "$contract_api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/public-contract-api.log" >&2
              exit 1
            fi
            if curl --max-time 2 -fsS "$LV_API_BASE_URL/healthz" >/dev/null 2>&1 \
              && curl --max-time 2 -fsS "$LV_API_BASE_URL/swagger/doc.json" -o "$RUNNER_TEMP/swagger-online.json" 2>/dev/null; then
              contract_started=true
              break
            fi
            sleep 1
          done
          if [ "$contract_started" != true ]; then
            cat "$RUNNER_TEMP/public-contract-api.log" >&2
            exit 1
          fi
          export LANVERSE_CONTRACT_OUTPUT_ROOT="$(mktemp -d "$RUNNER_TEMP/lanverse-api-generated.XXXXXX")"
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const { isDeepStrictEqual } = require("node:util");
          const frontend = path.join(process.env.GITHUB_WORKSPACE, "frontend");
          const frontendRequire = createRequire(path.join(frontend, "package.json"));
          const config = frontendRequire("./openapi2ts.config.cjs");
          const { generateService } = frontendRequire("@umijs/openapi");
          const ts = frontendRequire("typescript");
          const outputRoot = process.env.LANVERSE_CONTRACT_OUTPUT_ROOT;
          async function verify() {
            const response = await fetch(config.schemaPath, { signal: AbortSignal.timeout(10000) });
            if (!response.ok) throw new Error(`online Swagger status ${response.status}`);
            const online = await response.json();
            const staticSchema = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "swagger-contract/docs/swagger.json"), "utf8"));
            if (!Object.hasOwn(staticSchema, "host") && online.host === "") delete online.host;
            if (!Object.hasOwn(staticSchema, "schemes") && Array.isArray(online.schemes) && online.schemes.length === 0) delete online.schemes;
            if (!isDeepStrictEqual(staticSchema, online)) throw new Error("production online Swagger differs from fresh artifacts");
            if (online.swagger !== "2.0" || !online.paths || Object.keys(online.paths).length === 0) throw new Error("invalid or empty online Swagger");
            const methods = new Set(["get", "post", "put", "patch", "delete", "head", "options"]);
            const ids = new Set();
            for (const [route, item] of Object.entries(online.paths)) {
              if (!route.startsWith("/api/") || /\/internal(?:\/|$)|callback|webhook/i.test(route)) throw new Error(`non-public path ${route}`);
              for (const [method, operation] of Object.entries(item)) {
                if (!methods.has(method)) continue;
                const id = operation.operationId;
                if (typeof id !== "string" || !id.trim() || ids.has(id)) throw new Error(`invalid operationId for ${method} ${route}`);
                ids.add(id);
              }
            }
            if (ids.size === 0) throw new Error("online Swagger has no operations");
            // The upstream CLI catches errors without failing. Generate into a
            // new directory, propagate rejection, and require actual output.
            await generateService({ ...config, serversPath: outputRoot, projectName: "api" });
            const directory = path.join(outputRoot, "api");
            for (const file of ["index.ts", "typings.d.ts"]) {
              if (!fs.existsSync(path.join(directory, file)) || fs.statSync(path.join(directory, file)).size === 0) throw new Error(`missing generated ${file}`);
            }
            const exported = new Set();
            for (const file of fs.readdirSync(directory).filter((file) => file.endsWith(".ts"))) {
              const source = ts.createSourceFile(file, fs.readFileSync(path.join(directory, file), "utf8"), ts.ScriptTarget.Latest, true);
              for (const statement of source.statements) {
                if (ts.isFunctionDeclaration(statement) && statement.name && statement.modifiers?.some((modifier) => modifier.kind === ts.SyntaxKind.ExportKeyword)) exported.add(statement.name.text);
              }
            }
            for (const id of ids) if (!exported.has(id)) throw new Error(`missing generated operation ${id}`);
            console.log(`Verified online Swagger with ${ids.size} public operations and fresh client output.`);
          }
          verify().catch((error) => {
            console.error(error instanceof Error ? error.message : "contract generation failed");
            process.exitCode = 1;
          });
          JS
          pnpm --dir "$GITHUB_WORKSPACE/frontend" exec prettier --config "$GITHUB_WORKSPACE/frontend/.prettierrc.json" --write "$LANVERSE_CONTRACT_OUTPUT_ROOT/api/**/*.ts"
          git diff --no-index --exit-code -- ../frontend/src/gen/api "$LANVERSE_CONTRACT_OUTPUT_ROOT/api"
          {
            echo '## Public contract gate'
            echo ''
            echo 'Fresh Swagger, production online schema, public route coverage, and fresh online client match this commit.'
            echo 'This gate does not probe /readyz or prove Temporal/object-storage readiness or product acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec next build

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag lanverse/backend:ci backend
      - run: docker build --file frontend/Dockerfile --tag lanverse/frontend:ci frontend
