        run: go test -race ./tests/db ./tests/app -run '^TestAuditRestrictedLogin' -count=1 -v
      - run: govulncheck ./...
      - run: wire ./internal/app
      - run: goimports -local github.com/StephenQiu30/lanverse/backend -w internal/app/wire_gen.go
      - run: git diff --exit-code -- internal/app/wire_gen.go
      - name: Verify generated source contract and removed public endpoints
