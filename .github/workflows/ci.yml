name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_test?sslmode=disable
      LV_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      LV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanverse_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lanverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanverse_test -d lanverse_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Keep backend tests outside production source
        run: |
          test_file="$(find . -type f -name '*_test.go' ! -path './tests/*' -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Go tests must live under backend/tests/: $test_file" >&2
            exit 1
          fi
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/google/wire/cmd/wire@v0.7.0
      - run: test -z "$(gofmt -l .)"
      - run: test -z "$(goimports -local github.com/StephenQiu30/lanverse/backend -l .)"
      - run: go vet ./...
      - run: golangci-lint run ./...
      - run: go test -race ./...
      - name: Prepare isolated identity contract databases
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_gate_test'
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_bootstrap_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609270435_create_outbox.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271020_create_organization.up.sql
      - name: Verify identity PostgreSQL and Redis contracts
        env:
          LV_TEST_IDENTITY_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable
          LV_TEST_IDENTITY_REDIS_URL: redis://127.0.0.1:6379/14
        run: go test -race ./tests/identity -run '^Test(Identity|SessionStore|LoginLimiter|AuthenticateRejectsDisabledAccountWithRealPostgresAndRedis)' -count=1 -v
      - name: Verify first-admin bootstrap in its own database
        env:
          LV_TEST_BOOTSTRAP_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable
        run: go test -race ./tests/identity -run '^TestBootstrapAdminIsAtomicAndSingleUseWithRealPostgres$' -count=1 -v
      - name: Prepare isolated provider contract database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_catalog_provider_gate_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609270435_create_outbox.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271010_create_identity_user.up.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -v ON_ERROR_STOP=1 -f db/migrations/202609271100_create_provider_credentials.up.sql
      - name: Verify provider PostgreSQL and administrator contracts
        env:
          LV_TEST_CATALOG_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable
        run: go test -race ./tests/catalog -run '^Test(ProviderRejectsInvalidSettingsAndDisablesOnce|CredentialKeepsCiphertextOutOfJSONAndValidatesTestOutcome|ProviderCredentialsWithRealPostgres|ConcurrentCredentialReplacementKeepsOneActive|CreateProviderCommitsAuditAndRejectsStaleAdminOnLocalPostgres|UpdateProviderCommitsEventsAndRejectsStaleAdminOnLocalPostgres|SetCredentialCommitsSealedDataAndEventsOnLocalPostgres|DisableCredentialCommitsSafeEventsAndRollsBackOnAuditFailure|ProviderDetailReadsSafeMetadataWithCurrentAdminOnLocalPostgres)$' -count=1 -v
      - name: Prepare PostgreSQL contract databases
        run: psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE ROLE lanverse_app'
      - name: Apply migrations for PostgreSQL contract tests
        run: find db/migrations -maxdepth 1 -name '*.up.sql' -print0 | sort -z | xargs -0 -n1 psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -f
      - name: Verify operation PostgreSQL contracts
        run: LV_TEST_OPERATION_SCHEMA_DB_DSN="$LV_TEST_DB_DSN" LV_TEST_OPERATION_STORE_DB_DSN="$LV_TEST_DB_DSN" go test -race ./tests/operation -count=1
      - name: Prepare isolated media migration database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_media_migration_test'
          for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
            case "$migration" in
              *202609271180_create_media_asset.up.sql) break ;;
            esac
            psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_migration_test?sslmode=disable' -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify media PostgreSQL contracts
        run: |
          LV_TEST_MEDIA_STORE_DB_DSN="$LV_TEST_DB_DSN" \
          LV_TEST_MEDIA_MIGRATION_DB_DSN='postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_migration_test?sslmode=disable' \
          go test -race ./tests/media -count=1
      - name: Prepare isolated restricted-login audit database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE lanverse_runtime_test LOGIN INHERIT PASSWORD 'ci-only'"
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'GRANT lanverse_app TO lanverse_runtime_test'
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_audit_role_test'
          for migration in $(find db/migrations -maxdepth 1 -name '*.up.sql' | sort); do
            psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable' -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify audit contracts with a real restricted login
        env:
          LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_AUDIT_OWNER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_AUDIT_LOGIN_DB_DSN: postgres://lanverse_runtime_test:ci-only@127.0.0.1:5432/lanverse_audit_role_test?sslmode=disable
          LV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
          LV_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: go test -race ./tests/db ./tests/app -run '^TestAuditRestrictedLogin' -count=1 -v
      - run: govulncheck ./...
      - run: wire ./internal/app
      - run: goimports -local github.com/StephenQiu30/lanverse/backend -w internal/app/wire_gen.go
      - run: git diff --exit-code -- internal/app/wire_gen.go

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Go credential envelopes in Agent
        run: LV_TEST_CREDENTIAL_INTEROP=1 go test -race ./tests/catalog -run TestGoCredentialEnvelopeOpensInAgent -count=1
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec next build

  images:
    runs-on: ubuntu-24.04
    needs: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag lanverse/backend:ci backend
      - run: docker build --file agent/Dockerfile --tag lanverse/agent:ci agent
      - run: docker build --file frontend/Dockerfile --tag lanverse/frontend:ci frontend
