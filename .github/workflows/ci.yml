name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / FastAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Check and test FastAPI backend
        working-directory: backend
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
          pyright app tests scripts
          pytest tests/unit tests/contract tests/architecture -q

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate current API client
        working-directory: frontend
        run: OPENAPI_SCHEMA_URL=../backend/openapi.json npm run openapi2ts
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi:
    name: API / OpenAPI Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and regenerate API client
        run: |
          python -m pip install -e backend
          cd backend
          python -m scripts.export_openapi
          cd ..
          npm ci --prefix frontend
          cd frontend
          OPENAPI_SCHEMA_URL=../backend/openapi.json npm run openapi2ts
      - name: Ensure generated client is committed
        run: git diff --exit-code -- backend/openapi.json frontend/src/api

  delivery:
    name: Delivery / Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, openapi]
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|log)$|data/|logs/|playwright-report/|test-results/)' | grep -v -E '\.env(\.production)?\.example$'; then
            echo 'tracked secret/data/report artifact detected' >&2
            exit 1
          fi
          test ! -d agent
          ! find backend -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print -quit | grep -q .

  required:
    name: Required / CI
    if: ${{ always() }}
    needs: [backend, frontend, openapi, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project boundary to pass
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.openapi.result }}" = success
          test "${{ needs.delivery.result }}" = success
