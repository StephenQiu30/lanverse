name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: lanverse_ci
          POSTGRES_USER: lanverse_ci
          POSTGRES_PASSWORD: lanverse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanverse_ci -d lanverse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Start real Temporal service
        run: |
          docker run --detach --name lanverse-ci-temporal --publish 7233:7233 \
            temporalio/temporal@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e \
            server start-dev --ip 0.0.0.0 --db-filename /tmp/temporal.db
          for attempt in {1..30}; do
            if docker exec lanverse-ci-temporal temporal operator cluster health --address 127.0.0.1:7233; then
              exit 0
            fi
            sleep 1
          done
          docker logs lanverse-ci-temporal
          exit 1
      - name: Check and test Go backend
        working-directory: backend
        env:
          LANVERSE_TEST_DATABASE_URL: postgresql://lanverse_ci:lanverse_ci@127.0.0.1:5432/lanverse_ci?sslmode=disable
          LANVERSE_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -p 1 ./...

  agent:
    name: Agent / Candidate Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -e '.[dev]'
      - name: Check and test Python Agent
        working-directory: agent
        run: |
          ruff check app tests
          ruff format --check app tests
          pyright app tests
          pytest -q

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate current API client
        working-directory: frontend
        run: npm run openapi2ts
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi:
    name: API / Generated Client Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate API client from Backend contract
        working-directory: frontend
        run: npm run openapi2ts
      - name: Ensure generated client is committed
        run: git diff --exit-code -- frontend/src/api

  delivery:
    name: Delivery / Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, agent, frontend, openapi]
    steps:
      - uses: actions/checkout@v6
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|log)$|data/|logs/|playwright-report/|test-results/)' | grep -v -E '\.env(\.production)?\.example$'; then
            echo 'tracked secret/data/report artifact detected' >&2
            exit 1
          fi
          test -f backend/go.mod
          test -f agent/pyproject.toml
          ! find backend -type f \( -name '*.py' -o -name 'pyproject.toml' \) -print -quit | grep -q .
          ! find agent -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print -quit | grep -q .

  required:
    name: Required / CI
    if: ${{ always() }}
    needs: [backend, agent, frontend, openapi, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project boundary to pass
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.agent.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.openapi.result }}" = success
          test "${{ needs.delivery.result }}" = success
