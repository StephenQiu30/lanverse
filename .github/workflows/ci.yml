      - name: Prepare zero-skip contract result checker
        run: |
          cat > "$RUNNER_TEMP/require-contract-results.py" <<'PY'
          import collections
          import json
          import os
          import sys
          from pathlib import Path

          log = Path(os.environ["RUNNER_TEMP"]) / sys.argv[1]
          required = dict(argument.split("=", 1) for argument in sys.argv[2:])
          started, passed, rejected = set(), set(), []
          for line in log.read_text().splitlines():
              event = json.loads(line)
              action, test = event["Action"], event.get("Test", "")
              key = (event["Package"], test)
              if action in ("fail", "skip"):
                  rejected.append((action, key))
              if test and "/" not in test:
                  if action == "run":
                      started.add(key)
                  elif action == "pass":
                      passed.add(key)
          assert not rejected, (log.name, rejected)
          assert started == passed, (log.name, "unsettled tests", started - passed)
          counts = collections.Counter(package.rsplit("/", 1)[-1] for package, test in passed)
          for package, minimum in required.items():
              assert counts[package] >= int(minimum), (log.name, package, counts)
          assert set(counts) == set(required), (log.name, "unexpected packages", counts)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n{log.stem}: {dict(counts)} passed; zero package, test or subtest failures/skips.\n")
          PY
      - name: Verify personal and project libraries, uploads, and verified attachments
