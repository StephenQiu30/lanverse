name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Test Go backend
        working-directory: backend
        run: |
          gofmt -d cmd src | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go vet ./...
          go test ./...

  agent:
    name: Agent / Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install agent dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e 'agent[test]'
      - name: Test private agent
        run: PYTHONPATH=agent/src python -m pytest agent/tests -q

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate current API client
        working-directory: frontend
        run: OPENAPI_SCHEMA_URL=../backend/api/openapi.json npm run openapi2ts
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi:
    name: API / OpenAPI Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and regenerate API client
        working-directory: frontend
        run: |
          npm ci
          OPENAPI_SCHEMA_URL=../backend/api/openapi.json npm run openapi2ts
      - name: Ensure generated client is committed
        run: git diff --exit-code -- frontend/src/api

  delivery:
    name: Delivery / Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, agent, frontend, openapi]
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|log)$|data/|logs/|playwright-report/|test-results/)' | grep -v -E '\.env(\.production)?\.example$'; then
            echo 'tracked secret/data/report artifact detected' >&2
            exit 1
          fi
          ! rg -n -i 'rabbitmq|/api/v1|postgresql\+asyncpg' --glob '!docs/**' --glob '!frontend/package-lock.json' --glob '!README.md' .

  required:
    name: Required / CI
    if: ${{ always() }}
    needs: [backend, agent, frontend, openapi, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project boundary to pass
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.agent.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.openapi.result }}" = success
          test "${{ needs.delivery.result }}" = success
