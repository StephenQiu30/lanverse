          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz \
            --output "$archive"
          echo "d8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/temporal-contract-bin" temporal
          temporal_bin="$RUNNER_TEMP/temporal-contract-bin/temporal"
          "$temporal_bin" --version
          "$temporal_bin" --disable-config-env --disable-config-file server start-dev \
