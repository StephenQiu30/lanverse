name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanverse_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lanverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanverse_test -d lanverse_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: test -z "$(gofmt -l .)"
      - run: test -z "$(goimports -local github.com/StephenQiu30/lanverse/backend -l .)"
      - run: go vet ./...
      - run: golangci-lint run ./...
      - run: go test -race ./...
      - run: govulncheck ./...

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec next build

  images:
    runs-on: ubuntu-24.04
    needs: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag lanverse/backend:ci backend
      - run: docker build --file agent/Dockerfile --tag lanverse/agent:ci agent
      - run: docker build --file frontend/Dockerfile --tag lanverse/frontend:ci frontend
