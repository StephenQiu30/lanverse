name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: lanverse_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lanverse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Generate and verify OpenAPI client
        run: |
          cd backend
          uv run --frozen --no-python-downloads uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ..
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          OPENAPI_SCHEMA_URL=http://127.0.0.1:8000/openapi.json make generate-api
          git diff --exit-code -- frontend/src/api
      - run: make check
      - run: make docker-build
