name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: lanverse_ci
          POSTGRES_USER: lanverse_ci
          POSTGRES_PASSWORD: lanverse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanverse_ci -d lanverse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Start real Temporal service
        run: |
          docker run --detach --name lanverse-ci-temporal --publish 7233:7233 \
            temporalio/temporal@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e \
            server start-dev --ip 0.0.0.0 --db-filename /tmp/temporal.db
          for attempt in {1..30}; do
            if docker exec lanverse-ci-temporal temporal operator cluster health --address 127.0.0.1:7233; then
              exit 0
            fi
            sleep 1
          done
          docker logs lanverse-ci-temporal
          exit 1
      - name: Start private MinIO service
        run: |
          docker run --detach --name lanverse-ci-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=lanverse_ci --env MINIO_ROOT_PASSWORD=lanverse_ci_minio_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address :9000 --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs lanverse-ci-minio
          exit 1
      - name: Start real Kafka KRaft and Elasticsearch services
        env:
          KAFKA_PORT: 19092
          ELASTICSEARCH_PORT: 19200
        run: |
          docker compose -f docker-compose.yml -f docker-compose-env.yml up --detach --wait --wait-timeout 240 kafka kafka-init elasticsearch
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server 127.0.0.1:9092 \
            --entity-type topics --entity-name lanverse.business.script-version.v1 --describe \
            | grep -q 'retention.ms=604800000'
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server 127.0.0.1:9092 \
            --entity-type topics --entity-name lanverse.business.script-version.dlq.v1 --describe \
            | grep -q 'retention.ms=2592000000'
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server 127.0.0.1:9092 \
            --entity-type topics --entity-name lanverse.business.storygraph-version.v1 --describe \
            | grep -q 'retention.ms=604800000'
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T kafka \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server 127.0.0.1:9092 \
            --entity-type topics --entity-name lanverse.business.storygraph-version.dlq.v1 --describe \
            | grep -q 'retention.ms=2592000000'
          ! docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list \
            | grep -qi command
          test "$(curl --fail --silent http://127.0.0.1:19200 | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["number"])')" = "9.4.4"
      - name: Check and test Go backend
        working-directory: backend
        env:
          LANVERSE_TEST_DATABASE_URL: postgresql://lanverse_ci:lanverse_ci@127.0.0.1:5432/lanverse_ci?sslmode=disable
          LANVERSE_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
          LANVERSE_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          LANVERSE_TEST_MINIO_ACCESS_KEY: lanverse_ci
          LANVERSE_TEST_MINIO_SECRET_KEY: lanverse_ci_minio_secret
          LANVERSE_TEST_MINIO_BUCKET: lanverse-asset-ci
          LANVERSE_TEST_KAFKA_BROKERS: 127.0.0.1:19092
          LANVERSE_TEST_KAFKA_SCRIPT_TOPIC: lanverse.business.script-version.v1
          LANVERSE_TEST_KAFKA_SCRIPT_DLQ_TOPIC: lanverse.business.script-version.dlq.v1
          LANVERSE_TEST_KAFKA_STORYGRAPH_TOPIC: lanverse.business.storygraph-version.v1
          LANVERSE_TEST_KAFKA_STORYGRAPH_DLQ_TOPIC: lanverse.business.storygraph-version.dlq.v1
          LANVERSE_TEST_ELASTICSEARCH_URL: http://127.0.0.1:19200
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -p 1 ./...

  agent:
    name: Agent / Candidate Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -e '.[dev]'
      - name: Check and test Python Agent
        working-directory: agent
        run: |
          ruff check app tests
          ruff format --check app tests
          pyright app tests
          pytest -q

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate current API client
        working-directory: frontend
        run: npm run openapi2ts
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi:
    name: API / Generated Client Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate API client from Backend contract
        working-directory: frontend
        run: npm run openapi2ts
      - name: Ensure generated client is committed
        run: git diff --exit-code -- frontend/src/api

  deployment:
    name: Deployment / Images and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate development and production Compose
        env:
          LANVERSE_FRONTEND_IMAGE: lanverse/frontend:ci
          LANVERSE_BACKEND_IMAGE: lanverse/backend:ci
          POSTGRES_PASSWORD: ci-compose-only
          JWT_SECRET_KEY: ci-compose-only-jwt
          AGENT_URL: http://agent.example.test
          AGENT_EXECUTION_SECRET: ci-compose-only-agent
          TEMPORAL_ADDRESS: temporal.example.test:7233
          MINIO_PUBLIC_ENDPOINT: media.example.test
          MINIO_ACCESS_KEY: ci-compose-only
          MINIO_SECRET_KEY: ci-compose-only-secret
          LANVERSE_CORS_ORIGINS: '["https://app.example.test"]'
          MINIO_CORS_ORIGINS: https://app.example.test
        run: |
          docker compose -f docker-compose.yml -f docker-compose-env.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose-env.yml -f docker-compose-prod.yml config --quiet
      - name: Build Frontend deployment image
        run: docker build --tag lanverse/frontend:ci frontend
      - name: Build Backend deployment image
        run: docker build --tag lanverse/backend:ci backend
      - name: Build Agent deployment image
        run: docker build --file agent/Dockerfile --tag lanverse/agent:ci .
      - name: Require Backend binaries
        run: >-
          docker run --rm --entrypoint /bin/sh lanverse/backend:ci -c
          'test -x /usr/local/bin/lanverse-api && test -x /usr/local/bin/lanverse-workflow-worker &&
          test -x /usr/local/bin/lanverse-event-worker'
      - name: Require Frontend standalone runtime
        run: >-
          docker run --rm --entrypoint /bin/sh lanverse/frontend:ci -c
          'test -f /srv/lanverse/frontend/server.js && test -d /srv/lanverse/frontend/.next/static'
      - name: Require private Agent candidate runtime
        run: >-
          docker run --rm --entrypoint /bin/sh lanverse/agent:ci -c
          'command -v codex >/dev/null && python -c "from app.candidate_runtime.api import app; assert app.title == '\''Lanverse Candidate Runtime'\''"'
      - name: Run deployment images against real dependencies
        run: |
          docker tag lanverse/frontend:ci lanverse/frontend:development
          docker tag lanverse/backend:ci lanverse/backend:development
          docker compose -f docker-compose.yml -f docker-compose-env.yml up --detach --no-build --wait --wait-timeout 180
          docker compose -f docker-compose.yml -f docker-compose-env.yml ps --status running --services | grep -qx workflow-worker
          docker compose -f docker-compose.yml -f docker-compose-env.yml ps --status running --services | grep -qx event-worker
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color workflow-worker | grep -q "lanverse workflow worker started"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color workflow-worker
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color event-worker | grep -q "lanverse event worker started"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color event-worker
              exit 1
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T event-worker \
            wget --quiet --spider http://127.0.0.1:8687/readyz
          docker compose -f docker-compose.yml -f docker-compose-env.yml stop kafka
          if docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T event-worker \
            wget --quiet --spider http://127.0.0.1:8687/readyz; then
            echo 'event-worker stayed ready while Kafka was unavailable' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml -f docker-compose-env.yml ps --status running --services | grep -qx event-worker
          docker compose -f docker-compose.yml -f docker-compose-env.yml start kafka
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T event-worker \
              wget --quiet --spider http://127.0.0.1:8687/readyz; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color event-worker kafka
              exit 1
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T elasticsearch \
            curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-script-search-v1 >/dev/null
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T elasticsearch \
            curl --fail --silent http://127.0.0.1:9200/_alias/lanverse-storygraph-search-v1 >/dev/null
          docker compose -f docker-compose.yml -f docker-compose-env.yml stop elasticsearch
          if docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T event-worker \
            wget --quiet --spider http://127.0.0.1:8687/readyz; then
            echo 'event-worker stayed ready while Elasticsearch was unavailable' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T backend \
            wget --quiet --spider http://127.0.0.1:8686/healthz
          docker compose -f docker-compose.yml -f docker-compose-env.yml ps --status running --services | grep -qx event-worker
          docker compose -f docker-compose.yml -f docker-compose-env.yml start elasticsearch
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml exec -T event-worker \
              wget --quiet --spider http://127.0.0.1:8687/readyz; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose-env.yml logs --no-color event-worker elasticsearch
              exit 1
            fi
            sleep 1
          done
          docker run --detach --name lanverse-ci-agent-runtime --publish 127.0.0.1:18787:8787 --env AGENT_EXECUTION_SECRET=ci-agent-runtime-secret-at-least-32-bytes lanverse/agent:ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:8686/healthz
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:8123/
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:18787/healthz
      - name: Clean deployment runtime
        if: always()
        run: |
          docker rm --force lanverse-ci-agent-runtime 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose-env.yml down --volumes --remove-orphans

  delivery:
    name: Delivery / Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, agent, frontend, openapi]
    steps:
      - uses: actions/checkout@v6
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|log)$|data/|logs/|playwright-report/|test-results/)' | grep -v -E '\.env(\.production)?\.example$'; then
            echo 'tracked secret/data/report artifact detected' >&2
            exit 1
          fi
          test -f backend/go.mod
          test -f agent/pyproject.toml
          ! find backend -type f \( -name '*.py' -o -name 'pyproject.toml' \) -print -quit | grep -q .
          ! find agent -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print -quit | grep -q .

  required:
    name: Required / CI
    if: ${{ always() }}
    needs: [backend, agent, frontend, openapi, deployment, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every project boundary to pass
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.agent.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.openapi.result }}" = success
          test "${{ needs.deployment.result }}" = success
          test "${{ needs.delivery.result }}" = success
