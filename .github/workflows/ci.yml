name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      LV_TEST_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_test?sslmode=disable
      LV_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      LV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: lanverse_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lanverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanverse_test -d lanverse_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Keep backend tests outside production source
        run: |
          test_file="$(find . -type f -name '*_test.go' ! -path './tests/*' -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Go tests must live under backend/tests/: $test_file" >&2
            exit 1
          fi
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/google/wire/cmd/wire@v0.7.0
      - run: test -z "$(gofmt -l .)"
      - run: test -z "$(goimports -local github.com/StephenQiu30/lanverse/backend -l .)"
      - run: go vet ./...
      - run: golangci-lint run ./...
      - name: Install media probe tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: command -v ffmpeg && command -v ffprobe
      - name: Require one database schema source
        run: test "$(find db -type f -name '*.sql' -print)" = 'db/schema.sql'
      - name: Provision schema role and load complete PostgreSQL contract schema
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE ROLE lanverse_app NOLOGIN NOSUPERUSER'
          psql "$LV_TEST_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify schema loads atomically into an empty database
        env:
          LV_TEST_SCHEMA_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_schema_gate_test?sslmode=disable
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_schema_gate_test'
          go test -race ./tests/db -run '^TestSchema' -count=1 -v
      - name: Run backend Race tests
        shell: bash
        run: go test -race -count=1 -json ./... | tee "$RUNNER_TEMP/backend-tests.jsonl"
      - name: Report backend test execution and skips
        if: always()
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["RUNNER_TEMP"]) / "backend-tests.jsonl"
          lines = ["## Backend Race tests", ""]
          if not results.exists():
              lines.append("Tests did not run; inspect the earlier failed step.")
          else:
              counts = collections.Counter()
              skipped = collections.Counter()
              for line in results.read_text().splitlines():
                  event = json.loads(line)
                  test = event.get("Test", "")
                  action = event["Action"]
                  if test and "/" not in test and action in ("pass", "fail", "skip"):
                      counts[action] += 1
                      if action == "skip":
                          skipped[event["Package"].rsplit("/", 1)[-1]] += 1
              lines.append(f"Top-level tests: {counts['pass']} passed, {counts['fail']} failed, {counts['skip']} skipped.")
              lines.extend(["", "Skipped tests are not acceptance evidence. Dedicated integration steps below have separate results."])
              if skipped:
                  lines.extend(["", "| Package | Skipped |", "| --- | ---: |"])
                  lines.extend(f"| {package} | {count} |" for package, count in sorted(skipped.items()))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Prepare isolated identity contract databases
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_gate_test'
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_bootstrap_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable' -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable' -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify identity PostgreSQL and Redis contracts
        env:
          LV_TEST_IDENTITY_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_gate_test?sslmode=disable
          LV_TEST_IDENTITY_REDIS_URL: redis://127.0.0.1:6379/14
        run: go test -race ./tests/identity -run '^Test(Identity|SessionStore|LoginLimiter|AuthenticateRejectsDisabledAccountWithRealPostgresAndRedis)' -count=1 -v
      - name: Verify first-admin bootstrap in its own database
        env:
          LV_TEST_BOOTSTRAP_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_bootstrap_test?sslmode=disable
        run: go test -race ./tests/identity -run '^TestBootstrapAdminIsAtomicAndSingleUseWithRealPostgres$' -count=1 -v
      - name: Verify M1 authentication in an isolated PostgreSQL database
        env:
          LV_TEST_AUTH_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_identity_auth_test?sslmode=disable
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_identity_auth_test'
          psql "$LV_TEST_AUTH_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          go test -race ./tests/identity -run '^TestAuthRegistrationSessionPasswordAndFailureTransactions$' -count=1 -v
      - name: Prepare isolated provider contract database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_catalog_provider_gate_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable' -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify provider PostgreSQL and administrator contracts
        env:
          LV_TEST_CATALOG_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_catalog_provider_gate_test?sslmode=disable
        run: go test -race ./tests/catalog -run '^Test(ProviderRejectsInvalidSettingsAndDisablesOnce|CredentialKeepsCiphertextOutOfJSONAndValidatesTestOutcome|ProviderCredentialsWithRealPostgres|ConcurrentCredentialReplacementKeepsOneActive|CreateProviderCommitsAuditAndRejectsStaleAdminOnLocalPostgres|UpdateProviderCommitsEventsAndRejectsStaleAdminOnLocalPostgres|SetCredentialCommitsSealedDataAndEventsOnLocalPostgres|DisableCredentialCommitsSafeEventsAndRollsBackOnAuditFailure|ProviderDetailReadsSafeMetadataWithCurrentAdminOnLocalPostgres)$' -count=1 -v
      - name: Prepare isolated canvas contract databases
        run: |
          for database in lanverse_canvas_store_test lanverse_canvas_http_test; do
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            psql "$contract_dsn" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          done
      - name: Verify canvas persistence and public HTTP contracts
        env:
          LV_TEST_CANVAS_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_canvas_store_test?sslmode=disable
          LV_TEST_CANVAS_HTTP_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_canvas_http_test?sslmode=disable
          LV_TEST_CANVAS_REDIS_URL: redis://127.0.0.1:6379/13
        run: go test -race ./tests/canvas -skip '^TestCanvasMediaReferenceGuard' -count=1 -v
      - name: Verify identity commands in isolated databases
        env:
          LV_TEST_IDENTITY_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          test_cases=(
            TestCreateUserCommitsAccountAndTwoOutboxEventsAtomically
            TestLoginUsesRealPostgresRedisAndAtomicAudit
            TestChangePasswordInvalidatesOtherSessionsWithRealPostgresRedis
            TestDisableUserCommitsStateAndEventsWithRealPostgresRedis
            TestAdminLifecycleRevokesSessionsAndRollsBackAuditFailureWithRealStores
            TestAdminDirectoryWithRealPostgres
          )
          for index in "${!test_cases[@]}"; do
            database="lanverse_identity_command_${index}"
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            psql "$contract_dsn" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
            LV_TEST_IDENTITY_DB_DSN="$contract_dsn" \
            LV_TEST_ACCOUNT_LIFECYCLE_DB_DSN="$contract_dsn" \
            LV_TEST_ACCOUNT_DIRECTORY_DB_DSN="$contract_dsn" \
            go test -race ./tests/identity -run "^${test_cases[$index]}$" -count=1 -v
          done
      - name: Verify catalog, billing, and workspace PostgreSQL contracts
        run: |
          for package in catalog billing workspace; do
            database="lanverse_${package}_contract"
            psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            contract_dsn="postgres://lanverse_test:ci-only@127.0.0.1:5432/$database?sslmode=disable"
            psql "$contract_dsn" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
            LV_TEST_CATALOG_DB_DSN="$contract_dsn" \
            LV_TEST_MODEL_CATALOG_DB_DSN="$contract_dsn" \
            LV_TEST_BILLING_DB_DSN="$contract_dsn" \
            LV_TEST_WORKSPACE_DB_DSN="$contract_dsn" \
            go test -race "./tests/$package" -skip '^TestWorkspaceMediaReferenceGuard' -count=1 -v
          done
      - name: Verify operation PostgreSQL contracts
        run: LV_TEST_OPERATION_SCHEMA_DB_DSN="$LV_TEST_DB_DSN" LV_TEST_OPERATION_STORE_DB_DSN="$LV_TEST_DB_DSN" go test -race ./tests/operation -skip '^TestOperationMediaReferenceGuard' -count=1
      - name: Prepare isolated media schema database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_media_schema_test'
          psql 'postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_schema_test?sslmode=disable' -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify media PostgreSQL contracts
        run: |
          LV_TEST_MEDIA_STORE_DB_DSN="$LV_TEST_DB_DSN" \
          LV_TEST_MEDIA_SCHEMA_DB_DSN='postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_media_schema_test?sslmode=disable' \
          go test -race ./tests/media -skip '^Test(MediaToolRetained|MediaPackage(Personal|ReplayAndAdmissionUseCommandBeforeProjectLock$|ReplayKeepsOriginalReceiptAndCurrentAuthority$))' -count=1
      - name: Prepare private receipt and export contract storage
        env:
          CI_STORAGE_ACCESS_KEY: lanverse-ci-only
          CI_STORAGE_SECRET_KEY: ci-only-private-object-storage
        run: |
          # 使用固定社区源提交构建，不依赖镜像仓库的历史制品可用性。
          GOBIN="$RUNNER_TEMP/receipt-storage-bin" \
            go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
          mkdir -p "$RUNNER_TEMP/receipt-storage-data"
          MINIO_ROOT_USER="$CI_STORAGE_ACCESS_KEY" \
          MINIO_ROOT_PASSWORD="$CI_STORAGE_SECRET_KEY" \
            "$RUNNER_TEMP/receipt-storage-bin/minio" server \
            "$RUNNER_TEMP/receipt-storage-data" --address 127.0.0.1:19000 \
            >"$RUNNER_TEMP/receipt-storage.log" 2>&1 &
          echo "LV_CI_STORAGE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:19000/minio/health/live; then
              break
            fi
            sleep 0.5
          done
          curl --silent --show-error --fail --max-time 5 http://127.0.0.1:19000/minio/health/live
          curl --silent --show-error --fail --max-time 10 \
            --aws-sigv4 'aws:amz:us-east-1:s3' \
            --user "$CI_STORAGE_ACCESS_KEY:$CI_STORAGE_SECRET_KEY" \
            --header 'x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' \
            --request PUT http://127.0.0.1:19000/lanverse-receipt-test
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path(os.environ["RUNNER_TEMP"]) / "private-receipt-storage.json"
          config.touch(mode=0o600)
          config.write_text(json.dumps({
              "endpoint": "http://127.0.0.1:19000",
              "bucket": "lanverse-receipt-test",
              "access_key": os.environ["CI_STORAGE_ACCESS_KEY"],
              "secret_key": os.environ["CI_STORAGE_SECRET_KEY"],
          }))
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"LV_TEST_RECEIPT_STORAGE_CONFIG={config}\n")
          PY
      - name: Prepare isolated public tool contract database
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_receipt'
          contract_dsn='postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable'
          psql "$contract_dsn" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify template quotes and private provider receipts
        env:
          LV_TEST_OPERATION_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: go test -race ./tests/prompt ./tests/operation -skip '^TestOperationMediaReferenceGuard' -count=1 -v
      - name: Verify actual private media exports and GLB under the runtime role
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_MEDIA_EXPORT_REQUIRE_ROLE: "1"
        run: go test -race ./tests/media -run '^Test(Export|GLB)' -count=1 -v
      - name: Verify complete project copy with PostgreSQL and private objects
        env:
          LV_TEST_WORKSPACE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_PROJECT_COPY_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: go test -race ./tests/workspace ./tests/canvas ./tests/media -run '^TestProjectCopy' -count=1 -v
      - name: Verify depth job PostgreSQL authority and private object contracts
        shell: bash
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          go test -race ./tests/media -run '^TestDepthJobPG' -count=1 -json | tee "$RUNNER_TEMP/depth-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "depth-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 9 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Depth job PostgreSQL contracts\n\n{counts['pass']} actual PostgreSQL/private-object tests passed, with no skips. Fixed-model MPS and real Temporal acceptance run separately; this Linux step does not prove native inference.\n")
          PY
      - name: Verify project folder and atomic copy placement under the runtime role
        shell: bash
        env:
          LV_TEST_FOLDER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_FOLDER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          go test -race ./tests/workspace -run '^TestProject(Folder|CopyPlacement)' -count=1 -json | tee "$RUNNER_TEMP/folder-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "folder-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 30 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Project folders and copy placement\n\n{counts['pass']} actual runtime-role PostgreSQL, permanent-receipt, atomic recycling, and physical-lock contracts passed without skips. Browser acceptance runs separately.\n")
          PY
      - name: Verify document originals and permanent project cover ownership
        shell: bash
        env:
          LV_TEST_DOCUMENT_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_DOCUMENT_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
          LV_TEST_COVER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_cover?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_COVER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_cover?sslmode=disable
          LV_TEST_FOLDER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_FOLDER_OWNER_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_receipt?sslmode=disable
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_cover'
          psql "$LV_TEST_COVER_OWNER_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          go test -race -p 1 ./tests/media ./tests/workspace -run '^Test(Document|ProjectCover|ProjectCopy(Cover|Document))' -count=1 -json | tee "$RUNNER_TEMP/cover-document-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "cover-document-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 36 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Document originals and project cover\n\n{counts['pass']} document container, real original-object upload/download/copy, permanent lifecycle receipt and image ownership contracts passed without skips. Browser acceptance runs separately.\n")
          PY
      - name: Verify retained document copy and cancellation cleanup under the runtime role
        shell: bash
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_library?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_LIBRARY_OWNER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_library?sslmode=disable
        run: |
          psql "$LV_TEST_DB_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lanverse_library'
          psql "$LV_TEST_LIBRARY_OWNER_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          go test -race ./tests/media -run '^TestProjectCopy(Retained|HistoricalDocument|LibraryNilFields|MediaPreservesContentWithoutExecutionHistory|MediaRealObjectsRegistrationAndCleanup|Cleanup)' -count=1 -json | tee "$RUNNER_TEMP/retained-copy-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "retained-copy-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 8 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"\n## Historical document copy and cancellation cleanup\n\n{counts['pass']} runtime-role PostgreSQL, independent private original bytes, legacy JSON and narrow cleanup permission contracts passed without skips. Full script history and browser acceptance run separately.\n")
          PY
      - name: Verify GIF animation and native GLB or JSON glTF under the runtime role
        shell: bash
        env:
          LV_TEST_MEDIA_STORE_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_library?sslmode=disable&options=-c%20role%3Dlanverse_app
          LV_TEST_LIBRARY_OWNER_DB_DSN: postgres://lanverse_test:ci-only@127.0.0.1:5432/lanverse_library?sslmode=disable
        run: |
          go test -race ./tests/media -run '^Test(GIF|GLTFJSON|GLB)' -count=1 -json | tee "$RUNNER_TEMP/media-format-pg.jsonl"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          counts = collections.Counter()
          for line in (Path(os.environ["RUNNER_TEMP"]) / "media-format-pg.jsonl").read_text().splitlines():
              event = json.loads(line)
              test = event.get("Test", "")
              if test and "/" not in test and event["Action"] in ("pass", "fail", "skip"):
                  counts[event["Action"]] += 1
          assert counts["pass"] >= 11 and counts["fail"] == 0 and counts["skip"] == 0, counts
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
