[project]
name = "lanverse"
version = "0.1.0"
description = "Lanverse AI short-drama production backend"
readme = "README.md"
requires-python = ">=3.13.14"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.139.2",
    "greenlet==3.5.4",
    "httpx==0.28.1",
    "langchain-core==1.5.1",
    "minio==7.2.20",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "rfc8785==0.1.4",
]

[project.scripts]
lanverse-api = "main:run"
lanverse-worker = "worker:run"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "worker"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
