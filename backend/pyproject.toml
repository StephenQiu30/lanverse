[project]
name = "lanverse-backend"
version = "0.1.0"
description = "Lanverse AI short-drama production platform backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "anyio>=4.14.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.12",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
required-version = "==0.11.32"
python-preference = "managed"
python-downloads = "never"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]
