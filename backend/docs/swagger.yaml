info:
  contact: {}
  description: Public identity, project query, resource canvas commands and authorized
    media previews.
  title: Lanverse API
  version: "0.1"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_identity_adapter_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_adapter_http.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
      summary: 密码登录
      tags:
      - auth
  /api/auth/logout:
    post:
      operationId: logout
      parameters:
      - description: UUID
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 会话CSRF令牌
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
      summary: 登出
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: currentUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_adapter_http.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
      summary: 当前账号
      tags:
      - auth
  /api/auth/password:
    post:
      consumes:
      - application/json
      operationId: changePassword
      parameters:
      - description: UUID
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 会话CSRF令牌
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: 当前与新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_identity_adapter_http.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_adapter_http.PasswordResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_StephenQiu30_lanverse_backend_internal_platform_httpapi.Problem'
      summary: 修改本人密码
      tags:
      - auth
  /api/canvases/{id}:
