input {
  tcp {
    host => "0.0.0.0"
    port => 5000
    codec => json_lines { decode_size_limit_bytes => 1048576 }
  }
}

filter {
  ruby {
    init => "require 'digest'"
    code => '
      source = event.to_hash
      valid = source["schema_version"] == "lanverse.log.application" &&
        source["service"].is_a?(String) && !source["service"].empty? &&
        source["level"].is_a?(String) &&
        (source["msg"].is_a?(String) || source["message"].is_a?(String))
      if !valid
        raw_sha256 = Digest::SHA256.hexdigest(source.to_json)
        source.keys.each { |key| event.remove(key) }
        event.set("@timestamp", LogStash::Timestamp.now)
        event.set("schema_version", "lanverse.log.dead-letter")
        event.set("error_code", "invalid_log_record")
        event.set("raw_sha256", raw_sha256)
        event.tag("lanverse_log_dlq")
      else
        timestamp = source["@timestamp"] || LogStash::Timestamp.now
        message = (source["msg"] || source["message"]).to_s
        message = message.gsub(/https?:\/\/[^\s]+/i, "[REDACTED_URL]")
        message = message.gsub(/(authorization|token|password|secret|credential|claim|prompt|candidate)(\s*[:=]\s*)([^\s,;]+)/i, "\\1\\2[REDACTED]")
        allowed = %w[
          schema_version service environment level event trace_id request_id
          workflow_run_id node_run_id node_id task_id decision_id provider_job_id
          receipt_id error_code method route status_code duration_ms
        ]
        clean = {}
        allowed.each { |key| clean[key] = source[key] if source.key?(key) }
        clean["message"] = message
        source.keys.each { |key| event.remove(key) }
        event.set("@timestamp", timestamp)
        clean.each { |key, value| event.set(key, value) }
      end
    '
  }
}

output {
  if "lanverse_log_dlq" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "lanverse-logs-dead-letter"
      ilm_enabled => false
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "lanverse-logs-application"
      ilm_enabled => false
      manage_template => false
    }
  }
}
