filebeat.autodiscover:
  providers:
    - type: docker
      host: unix:///var/run/docker.sock
      labels.dedot: true
      templates:
        - condition:
            equals:
              docker.container.labels.lanverse_log_collect: "true"
          config:
            - type: filestream
              id: lanverse-${data.docker.container.id}
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container:
                    stream: stdout
                    format: docker
              close.on_state_change.removed: false
              prospector.scanner.symlinks: true
              prospector.scanner.fingerprint.length: 64
              processors:
                - decode_json_fields:
                    fields: [message]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - drop_event:
                    when:
                      not:
                        equals:
                          schema_version: lanverse.log.v1

output.kafka:
  hosts: ["${KAFKA_BROKERS:kafka:19092}"]
  topic: "${KAFKA_LOG_TOPIC:lanverse.logs.application.v1}"
  username: "${KAFKA_FILEBEAT_USERNAME:filebeat}"
  password: "${KAFKA_FILEBEAT_PASSWORD}"
  sasl.mechanism: PLAIN
  required_acks: -1
  compression: gzip
  max_message_bytes: 1048576
  codec.json:
    pretty: false

logging.level: info
logging.to_files: false
monitoring.enabled: false
