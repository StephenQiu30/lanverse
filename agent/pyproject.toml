[project]
name = "lanverse-agent-runtime"
version = "0.1.0"
description = "Lanverse private candidate-generation Agent runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio==4.14.2",
    "fastapi==0.140.12",
    "langchain-core==1.6.0",
    "langgraph==1.2.9",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
