[project]
name = "lanverse-agent"
version = "0.1.0"
description = "Lanverse Agent service: FastAPI + Temporal Activity Worker + Agent Harness"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "temporalio>=1.33.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
