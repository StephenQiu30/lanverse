[project]
name = "lanverse-agent-runtime"
version = "0.1.0"
description = "Lanverse private candidate-generation Agent runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio==4.14.2",
    "fastapi==0.140.12",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]
creation = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.5",
    "temporalio==1.32.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
allow_redefinition_new = true
local_partial_types = true
plugins = ["pydantic.mypy"]
